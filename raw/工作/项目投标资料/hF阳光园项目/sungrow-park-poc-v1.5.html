<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合肥阳光电源产业园区 · 智慧园区运营平台 POC v0.3</title>
<style>
/* ==== CP.CORE TOKENS BEGIN ==== */
:root,[data-theme="light"]{
  --el-color-primary:#0975E5;
  --el-color-primary-light-3:#3B91EB;--el-color-primary-light-5:#6DACF1;
  --el-color-primary-light-7:#9FC8F6;--el-color-primary-light-8:#B8D6F8;
  --el-color-primary-light-9:#E7F1FC;--el-color-primary-dark-2:#0760BA;
  --el-color-success:#52C41A;--cp-success-bg:#F6FFED;--cp-success-border:#B7EB8F;
  --el-color-warning:#FAAD14;--cp-warning-bg:#FFFBE6;--cp-warning-border:#FFE58F;
  --el-color-danger:#FF4D4F;--cp-danger-bg:#FFF1F0;--cp-danger-border:#FFCCC7;
  --el-color-info:#8C8C8C;
  --el-bg-color:#FFFFFF;--el-bg-color-page:#F0F2F5;--el-bg-color-overlay:#FFFFFF;
  --el-fill-color-light:#FAFAFA;--cp-table-header:#F2F4FA;
  --cp-panel-bg:#F6F9FE;--cp-panel-grid:#E9F4FF;
  --el-text-color-primary:#333333;--el-text-color-regular:#595959;
  --el-text-color-secondary:#8C8C8C;--el-text-color-placeholder:#BFBFBF;
  --el-border-color:#E9EBEF;--el-border-color-light:#F1F3F5;--el-border-color-lighter:#F5F6F8;
  --el-border-radius-base:4px;--el-border-radius-small:2px;
  --cp-topbar-bg:#FFFFFF;--cp-side-bg:#FFFFFF;
  --cp-bld-plant:#E3EAF3;--cp-bld-aux:#EDF1F6;--cp-bld-aux2:#F0F3F7;
  --cp-bld-yard:#E6EEF4;--cp-bld-rsv:#F4F6F9;
  --cp-bld-dorm:#DCE6F4;--cp-bld-podium:#EFF3F8;
  --cp-uav-arm:#37474F;--cp-uav-body:#455A64;--cp-uav-edge:#B0BEC5;
  --cp-uav-prop:#0975E5;--cp-uav-trail:#0975E5;--cp-uav-under:#FFFFFF;
  --cp-bld-stk:#B6C4D6;--cp-bld-text:#4A5A6E;--cp-road:#FFFFFF;--cp-road-text:#9AA9BC;
}
[data-theme="dark"],[data-theme="screen"]{
  --navy:#142642;--navy2:#1E3559;--navy3:#24406B;--navy4:#0E1C33;--navy5:#0A1526;
  --line:#33507A;--ice:#DCE9F7;--mute:#9DB2CC;--white:#F7FAFF;
  --red:#E2231A;--teal:#1AA085;--teal2:#22C4A4;--gold:#E8A33D;--violet:#7B6BD6;--blue:#3E8FD4;
  --el-color-primary:#3E8FD4;
  --el-color-primary-light-3:#2F6FA8;--el-color-primary-light-5:#255A8A;
  --el-color-primary-light-7:#1D466C;--el-color-primary-light-8:#193C5D;
  --el-color-primary-light-9:#16334E;--el-color-primary-dark-2:#63A8E0;
  --el-color-success:#22C4A4;--cp-success-bg:#123A33;--cp-success-border:#1AA085;
  --el-color-warning:#E8A33D;--cp-warning-bg:#3A2E17;--cp-warning-border:#B07C28;
  --el-color-danger:#E2231A;--cp-danger-bg:#3A1512;--cp-danger-border:#9E1912;
  --el-color-info:#9DB2CC;
  --el-bg-color:#1E3559;--el-bg-color-page:#142642;--el-bg-color-overlay:#24406B;
  --el-fill-color-light:#24406B;--cp-table-header:#24406B;
  --cp-panel-bg:#0E1C33;--cp-panel-grid:#1E3559;
  --el-text-color-primary:#F7FAFF;--el-text-color-regular:#DCE9F7;
  --el-text-color-secondary:#9DB2CC;--el-text-color-placeholder:#6B819C;
  --el-border-color:#33507A;--el-border-color-light:#24406B;--el-border-color-lighter:#1E3559;
  --cp-topbar-bg:#0E1C33;--cp-side-bg:#0E1C33;
  --cp-bld-plant:#1C3E6B;--cp-bld-aux:#16294A;--cp-bld-aux2:#152540;
  --cp-bld-yard:#1B3A54;--cp-bld-rsv:#0F1D31;
  --cp-bld-dorm:#1F4A6B;--cp-bld-podium:#14263F;
  --cp-uav-arm:#8FA8C4;--cp-uav-body:#DCE9F7;--cp-uav-edge:#F7FAFF;
  --cp-uav-prop:#3E8FD4;--cp-uav-trail:#22C4A4;--cp-uav-under:#04101E;
  --cp-bld-stk:#82AAD8;--cp-bld-text:#FFFFFF;--cp-road:#0A1526;--cp-road-text:#E6F0FA;
}
/* ==== CP.CORE TOKENS END ==== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",-apple-system,sans-serif;
  font-size:14px;background:var(--el-bg-color-page);color:var(--el-text-color-primary);
  display:flex;flex-direction:column;overflow:hidden;transition:background .16s,color .16s}
#cp-core-topbar{height:42px;flex:0 0 42px;display:flex;align-items:stretch;
  background:var(--cp-topbar-bg);border-bottom:1px solid var(--el-border-color);
  position:relative;z-index:30}
.cp-core__brand{display:flex;align-items:center;padding:0 22px 0 16px;font-size:15px;
  font-weight:700;color:var(--el-color-primary);white-space:nowrap}
.cp-core__nav{display:flex;align-items:stretch;flex:1 1 auto;min-width:0;overflow:hidden}
.cp-core__nav a{display:flex;align-items:center;padding:0 14px;font-size:14px;cursor:pointer;
  color:var(--el-text-color-primary);white-space:nowrap;transition:color .14s}
.cp-core__nav a:hover,.cp-core__nav a.on{color:var(--el-color-primary)}
.cp-core__tools{display:flex;align-items:center;gap:8px;padding-right:14px}
.cp-core__tools .th{font-size:12px;cursor:pointer;color:var(--el-text-color-secondary);
  border:1px solid var(--el-border-color);border-radius:4px;padding:2px 8px;user-select:none}
.cp-core__tools .th:hover{color:var(--el-color-primary);border-color:var(--el-color-primary)}
.cp-core__avatar{width:26px;height:26px;border-radius:50%;
  background:linear-gradient(140deg,#8FB6E8,#4C7DB5)}
.cp-core__tools b{font-size:13px;font-weight:400;color:var(--el-text-color-regular)}
#cp-core-body{flex:1 1 auto;display:flex;min-height:0}
#cp-core-side{flex:0 0 196px;background:var(--cp-side-bg);
  border-right:1px solid var(--el-border-color);overflow-y:auto;padding:8px 0}
#cp-core-side.hide{flex-basis:0;border-right:none;overflow:hidden}
.cp-grp>b{display:flex;align-items:center;padding:10px 13px;font-size:13.5px;font-weight:400;
  color:var(--el-text-color-primary);cursor:pointer;user-select:none}
.cp-grp>b:hover{color:var(--el-color-primary)}
.cp-grp>b .ar{margin-left:auto;font-size:11px;color:var(--el-text-color-placeholder);
  transition:transform .16s}
.cp-grp.open>b .ar{transform:rotate(180deg)}
.cp-grp ul{display:none;list-style:none;padding-bottom:5px}
.cp-grp.open ul{display:block}
.cp-grp li{padding:7px 13px 7px 25px;font-size:13px;color:var(--el-text-color-regular);
  cursor:pointer;display:flex;align-items:center;gap:5px;line-height:1.45}
.cp-grp li:hover,.cp-grp li.on{color:var(--el-color-primary)}
.cp-dot{width:5px;height:5px;border-radius:50%;flex:0 0 5px;margin-left:auto}
.cp-dot.f{background:var(--el-color-primary)}
.cp-dot.e{background:transparent;border:1px solid var(--el-text-color-placeholder)}
#cp-core-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;position:relative}
#cp-core-crumb{flex:0 0 auto;padding:9px 16px;font-size:12.5px;
  color:var(--el-text-color-secondary);display:flex;align-items:center;gap:6px}
#cp-core-crumb b{color:var(--el-text-color-primary);font-weight:700}
#cp-core-crumb .tog{margin-left:auto;cursor:pointer;font-size:12px}
#cp-core-crumb .tog:hover{color:var(--el-color-primary)}
#cp-core-view{flex:1 1 auto;min-height:0;overflow:auto;padding:0 16px 16px}
#cp-core-view.bare{padding:0;overflow:hidden}
.cp-kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.cp-kpi{background:var(--el-bg-color);border:1px solid var(--el-border-color-light);
  border-radius:4px;padding:12px 15px}
.cp-kpi label{display:block;font-size:12.5px;color:var(--el-text-color-secondary);margin-bottom:5px}
.cp-kpi .v{font-size:25px;font-weight:700;line-height:1.1;color:var(--el-color-primary)}
.cp-kpi .v.g{color:var(--el-color-success)}.cp-kpi .v.o{color:var(--el-color-warning)}
.cp-kpi .v.r{color:var(--el-color-danger)}.cp-kpi .v.n{color:var(--el-text-color-primary)}
.cp-kpi .u{font-size:12.5px;font-weight:400;color:var(--el-text-color-secondary);margin-left:3px}
.cp-kpi .sub{font-size:11.5px;color:var(--el-text-color-placeholder);margin-top:3px}
.cp-card{background:var(--el-bg-color);border:1px solid var(--el-border-color-light);
  border-radius:4px;margin-bottom:12px}
.cp-card>h4{display:flex;align-items:center;padding:12px 15px 0;font-size:14.5px;font-weight:700}
.cp-card>h4 .hint{margin-left:auto;font-size:12px;font-weight:400;color:var(--el-text-color-secondary)}
.cp-card>h4 .ex{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--el-color-primary);cursor:pointer}
.cp-card>.bd{padding:13px 15px 15px}
.cp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cp-grid31{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.cp-grid13{display:grid;grid-template-columns:1fr 2fr;gap:12px}
@media(max-width:1240px){.cp-grid2,.cp-grid31,.cp-grid13{grid-template-columns:1fr}}
table.cp-tb{width:100%;border-collapse:collapse;font-size:13px}
table.cp-tb th{background:var(--cp-table-header);color:var(--el-text-color-regular);
  font-weight:600;text-align:left;padding:9px 11px;white-space:nowrap}
table.cp-tb td{padding:10px 11px;border-bottom:1px solid var(--el-border-color-lighter);
  color:var(--el-text-color-regular)}
table.cp-tb tr:hover td{background:var(--el-fill-color-light)}
table.cp-tb a{color:var(--el-color-primary);cursor:pointer}
.cp-tag{display:inline-block;padding:1px 8px;border-radius:2px;font-size:12px;
  line-height:19px;border:1px solid;white-space:nowrap}
.cp-tag.g{background:var(--cp-success-bg);color:var(--el-color-success);border-color:var(--cp-success-border)}
.cp-tag.o{background:var(--cp-warning-bg);color:var(--el-color-warning);border-color:var(--cp-warning-border)}
.cp-tag.r{background:var(--cp-danger-bg);color:var(--el-color-danger);border-color:var(--cp-danger-border)}
.cp-tag.b{background:var(--el-color-primary-light-9);color:var(--el-color-primary);border-color:var(--el-color-primary-light-7)}
.cp-tag.d{background:transparent;color:var(--el-text-color-placeholder);border-color:var(--el-border-color)}
.cp-btn{display:inline-block;padding:7px 14px;font-size:13px;border-radius:4px;
  background:var(--el-color-primary);color:#fff;border:1px solid var(--el-color-primary);cursor:pointer}
.cp-btn:hover{background:var(--el-color-primary-dark-2)}
.cp-btn.pl{background:transparent;color:var(--el-text-color-regular);border-color:var(--el-border-color)}
.cp-btn.pl:hover{color:var(--el-color-primary);border-color:var(--el-color-primary);background:transparent}
.cp-btn.sm{padding:4px 10px;font-size:12.5px}
.cp-inp,select.cp-inp{width:100%;padding:7px 10px;font-size:13px;
  border:1px solid var(--el-border-color);border-radius:4px;background:var(--el-bg-color);
  color:var(--el-text-color-primary)}
.cp-fld{margin-bottom:12px}
.cp-fld label{display:block;font-size:13px;color:var(--el-text-color-regular);margin-bottom:5px}
.cp-map{position:relative;background:#061020;
  border:1px solid var(--el-border-color-light);border-radius:4px;overflow:hidden}
.cp-map svg{display:block;width:100%;height:auto}
.cp-maptip{position:absolute;right:10px;top:10px;background:var(--el-bg-color-overlay);
  border:1px solid var(--el-border-color);border-radius:4px;padding:6px 10px;font-size:12px;
  color:var(--el-text-color-secondary)}
.cp-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;
  color:var(--el-text-color-secondary);margin-bottom:9px}
.cp-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;font-style:normal}
#cp-core-flow{flex:0 0 auto;background:var(--el-bg-color);
  border-top:1px solid var(--el-border-color);padding:9px 16px;display:none;
  align-items:center;gap:6px;flex-wrap:wrap}
#cp-core-flow.show{display:flex}
#cp-core-flow>span.t{font-size:13px;font-weight:600;margin-right:5px}
.cp-step{padding:4px 11px;font-size:12.5px;border-radius:14px;cursor:pointer;
  border:1px solid var(--el-border-color);color:var(--el-text-color-regular)}
.cp-step:hover,.cp-step.on{color:var(--el-color-primary);border-color:var(--el-color-primary)}
.cp-step.on{font-weight:600}
.cp-arw{color:var(--el-text-color-placeholder);font-size:11px}
#cp-core-flow .hint{margin-left:auto;font-size:12px;color:var(--el-text-color-placeholder)}
#cp-core-perf{position:absolute;right:14px;bottom:12px;z-index:20;
  background:var(--el-bg-color-overlay);border:1px solid var(--el-border-color);
  border-radius:4px;padding:5px 10px;font-size:11.5px;color:var(--el-text-color-secondary);
  display:flex;align-items:center;gap:8px;font-family:Consolas,Monaco,monospace}
#cp-core-perf b{font-size:14px;color:var(--el-color-success)}
#cp-core-perf .pm{cursor:pointer;padding:1px 6px;border:1px solid var(--el-border-color);
  border-radius:2px;font-size:10.5px}
#cp-core-screen{position:fixed;inset:0;z-index:100;background:var(--navy5,#0A1526);
  display:none;flex-direction:column;padding:18px 22px}
#cp-core-screen.show{display:flex}
#cp-core-screen h1{font-size:23px;color:#F7FAFF;text-align:center;letter-spacing:3px;
  font-weight:800;margin-bottom:14px}
#cp-core-screen .x{position:absolute;right:20px;top:16px;cursor:pointer;color:#9DB2CC;
  font-size:13px;border:1px solid #33507A;border-radius:4px;padding:3px 10px}
.cp-scr-grid{display:grid;grid-template-columns:1fr 2fr 1fr;gap:12px;flex:1 1 auto;min-height:0}
.cp-scr-card{background:#142642;border:1px solid #33507A;border-radius:4px;padding:11px;
  color:#DCE9F7;font-size:13px;overflow:auto}
.cp-scr-card h5{font-size:13px;color:#3E8FD4;margin-bottom:8px;font-weight:700;
  border-left:3px solid #3E8FD4;padding-left:7px}
.cp-scr-kpi{display:flex;justify-content:space-between;padding:5px 0;
  border-bottom:1px dashed #24406B;font-size:12.5px}
.cp-scr-kpi b{color:#22C4A4;font-family:Consolas,monospace;font-size:15px}
.cp-note{font-size:12.5px;color:var(--el-text-color-secondary);line-height:1.85}
.cp-note code{background:var(--el-fill-color-light);padding:1px 5px;border-radius:3px;
  font-family:Consolas,monospace;font-size:12px;color:var(--el-color-primary)}
/* ==== CP.LOG YMS 内嵌 ==== */
#cp-log-yms-frame{width:100%;height:100%;border:0;display:block;background:#0A1526}
.cp-log__wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.cp-log__bar{flex:0 0 auto;padding:7px 14px;background:var(--el-bg-color);
  border-bottom:1px solid var(--el-border-color);font-size:12.5px;
  color:var(--el-text-color-secondary);display:flex;align-items:center;gap:10px}
.cp-log__bar b{color:var(--el-text-color-primary);font-size:13px}
/* 剧本选择卡 */
/* 底部播放条（仿 YMS：解说 + 时间轴 + 控制条） */
#cp-sim-bar{flex:0 0 auto;display:none;background:var(--el-bg-color);
  border-top:1px solid var(--el-border-color);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
#cp-sim-bar.show{display:block}
.cp-bar__nar{display:flex;gap:11px;align-items:flex-start;padding:10px 16px 6px}
.cp-bar__nar .no{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-size:15px;font-weight:800;background:var(--el-color-primary-light-9);
  color:var(--el-color-primary)}
.cp-bar__nar .no.l1{background:var(--cp-danger-bg);color:var(--el-color-danger)}
.cp-bar__nar .tx{flex:1 1 auto;min-width:0}
.cp-bar__nar .tx b{font-size:14px;color:var(--el-text-color-primary);display:block;margin-bottom:2px}
.cp-bar__nar .tx p{font-size:12.5px;color:var(--el-text-color-regular);line-height:1.6;
  max-height:40px;overflow:hidden}
.cp-bar__nar .tx .mt{font-size:11.5px;color:var(--el-text-color-placeholder);
  font-family:Consolas,Monaco,monospace;margin-top:3px}
.cp-bar__tl{position:relative;height:26px;margin:0 18px}
.cp-bar__tl .ln{position:absolute;left:0;right:0;top:12px;height:3px;
  background:var(--el-border-color);border-radius:2px}
.cp-bar__tl .fill{position:absolute;left:0;top:12px;height:3px;
  background:var(--el-color-primary);border-radius:2px;transition:width .25s}
.cp-bar__tl .nd{position:absolute;top:6px;width:14px;height:14px;margin-left:-7px;
  border-radius:50%;background:var(--el-bg-color);border:2px solid var(--el-border-color);
  cursor:pointer;transition:.18s}
.cp-bar__tl .nd:hover{border-color:var(--el-color-primary)}
.cp-bar__tl .nd.dn{background:var(--el-color-primary);border-color:var(--el-color-primary)}
.cp-bar__tl .nd.cu{border-color:var(--el-color-primary);transform:scale(1.42);
  box-shadow:0 0 0 5px var(--el-color-primary-light-9)}
.cp-bar__tl .nd.l1{background:var(--el-color-danger);border-color:var(--el-color-danger)}
.cp-bar__ct{display:flex;align-items:center;gap:8px;padding:6px 16px 11px;flex-wrap:wrap}
.cp-bar__ct .ind{font-size:12.5px;color:var(--el-text-color-secondary);
  font-family:Consolas,Monaco,monospace}
.cp-bar__ct .ind b{color:var(--el-color-primary);font-size:14px}
.cp-bar__ct .sp2{margin-left:auto;font-size:12px;color:var(--el-text-color-placeholder)}
/* 现场视窗：随步骤切换 */
.cp-stage{border:1px solid var(--el-border-color);border-radius:5px;overflow:hidden;
  background:#0E1C33;position:relative}
.cp-stage__cap{position:absolute;left:0;right:0;top:0;padding:7px 11px;font-size:12px;
  color:#DCE9F7;background:linear-gradient(180deg,rgba(4,16,30,.92),rgba(4,16,30,0));
  display:flex;align-items:center;gap:8px;z-index:2}
.cp-stage__cap b{color:#F7FAFF;font-size:12.5px}
.cp-stage__cap .tg{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:2px;
  background:#8C1626;color:#fff}
/* 单据流转推演：审批链 / 活体单据 / 规则芯片 / 房态微缩 / 员工端 */
.cp-docgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
@media(max-width:1180px){.cp-docgrid{grid-template-columns:1fr}}
.cp-chain{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.cp-chain__n{flex:1 1 128px;min-width:128px;border:1px solid var(--el-border-color);
  border-radius:5px;padding:8px 10px;background:var(--el-bg-color)}
.cp-chain__n b{display:block;font-size:12.5px;color:var(--el-text-color-secondary)}
.cp-chain__n span{display:block;font-size:11px;color:var(--el-text-color-placeholder);
  margin:2px 0 5px;line-height:1.4}
.cp-chain__n i{font-style:normal;font-size:11.5px;font-weight:700;
  color:var(--el-text-color-placeholder)}
.cp-chain__n.cur{border-color:var(--el-color-primary);
  box-shadow:0 0 0 3px var(--el-color-primary-light-9)}
.cp-chain__n.cur b{color:var(--el-color-primary)}
.cp-chain__n.cur i{color:var(--el-color-warning)}
.cp-chain__n.ok{border-color:var(--cp-success-border);background:var(--cp-success-bg)}
.cp-chain__n.ok b{color:var(--el-color-success)}
.cp-chain__n.ok i{color:var(--el-color-success)}
.cp-doc{border:1px solid var(--el-border-color);border-radius:5px;padding:12px 14px;
  background:var(--cp-panel-bg)}
.cp-doc__f{display:flex;gap:10px;align-items:flex-start;padding:6px 0;
  border-bottom:1px dashed var(--el-border-color-lighter)}
.cp-doc__f label{flex:0 0 116px;font-size:12.5px;color:var(--el-text-color-secondary)}
.cp-doc__f label i{color:var(--el-color-danger);font-style:normal}
.cp-doc__f .vv{flex:1 1 auto;font-size:13px;color:var(--el-text-color-placeholder);

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;
    background:radial-gradient(1200px 760px at 74% -14%, #1b3358 0%, var(--navy) 46%, var(--navy5) 100%);
    color:var(--white);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .num{font-family:"Arial Narrow",Arial,sans-serif}

  header{display:flex;align-items:center;gap:16px;padding:9px 20px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(30,53,89,.6),rgba(20,38,66,0));flex:none}
  .brand{display:flex;align-items:center;font-weight:700;font-size:15px;letter-spacing:.3px;white-space:nowrap}
  .brand .lz{height:24px;width:auto;display:block;border-radius:3px}
  .brand .x{color:var(--mute)} .brand .sg{color:#3E8FD4}
  .htitle h1{font-size:16px;font-weight:800;line-height:1.2}
  .htitle p{font-size:9px;color:var(--teal);font-weight:700;letter-spacing:1.4px;margin-top:2px}
  .views{margin-left:auto;display:flex;gap:5px;background:var(--navy4);padding:4px;border-radius:10px;border:1px solid var(--line)}
  .views button{background:none;border:none;color:var(--mute);font:inherit;font-size:12px;font-weight:700;
    padding:7px 12px;border-radius:7px;cursor:pointer;transition:all .2s;white-space:nowrap}
  .views button.on{background:var(--red);color:#fff}
  .clock{font-size:10.5px;color:var(--mute);font-weight:700;text-align:right;line-height:1.35}
  .clock b{display:block;font-size:19px;color:#fff;font-family:"Arial Narrow",Arial,sans-serif}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;padding:10px 20px 0;flex:none}
  .kpi{background:linear-gradient(180deg,rgba(30,53,89,.5),rgba(20,38,66,.3));border:1px solid var(--line);
    border-radius:10px;padding:7px 11px}
  .kpi .k{font-size:9px;color:var(--mute);font-weight:700}
  .kpi .v{font-size:20px;font-weight:800;color:var(--teal2);line-height:1.2;margin-top:1px}
  .kpi .v small{font-size:9.5px;color:var(--mute);margin-left:2px}
  .kpi.hl .v{color:#fff;font-size:14px;padding-top:4px}

  .stage{flex:1;min-height:0;display:none;padding:10px 20px 4px}
  .stage.on{display:grid}
  #vSim{grid-template-columns:minmax(460px,820px) 1fr;gap:12px}
  .col{display:flex;flex-direction:column;gap:10px;min-height:0}
  .card{background:linear-gradient(180deg,rgba(30,53,89,.46),rgba(20,38,66,.3));border:1px solid var(--line);
    border-radius:13px;padding:10px 12px;display:flex;flex-direction:column;min-height:0}
  .ch{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex:none}
  .ch .t{font-size:12.5px;font-weight:800}
  .ch .s{font-size:8.5px;color:var(--teal);font-weight:700;letter-spacing:1px}
  .ch .r{margin-left:auto;font-size:10px;color:var(--mute);font-weight:700;text-align:right;line-height:1.4}

  .maphost{display:flex;flex:1;min-height:0}
  .mapbox{position:relative;flex:1;min-height:200px;border-radius:10px;overflow:hidden;background:#061020;
    border:1px solid #3A5A82}
  .mapbox svg{position:absolute;inset:0;width:100%;height:100%}
  .veh{transition:transform 1.2s linear}
  .veh .bd{transition:transform .42s cubic-bezier(.4,0,.25,1);transform-box:fill-box;transform-origin:center}
  .veh .plate{font-size:13px;font-weight:800;text-anchor:middle;paint-order:stroke;
    stroke:#04101E;stroke-width:5px;stroke-linejoin:round}
  .veh.off{opacity:0;pointer-events:none}
  .ring{fill:none;stroke-width:2.4;opacity:0;transform-box:fill-box;transform-origin:center}
  body.playing .veh.foc .ring{animation:ping 2.2s ease-out infinite}
  body.playing .veh.foc .ring.b{animation-delay:1.1s}
  @keyframes ping{0%{transform:scale(.3);opacity:.85}100%{transform:scale(2.1);opacity:0}}
  .mdock{transition:fill .55s ease,stroke .55s ease}
  .trail{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ovpulse{animation:ovp 1.5s ease-in-out infinite}
  @keyframes ovp{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.9;transform:scale(1.12)}}
  .navimg{width:100%;display:block;flex:1;min-height:0;object-fit:cover;object-position:top center}
  .legend{display:flex;gap:7px 13px;flex-wrap:wrap;padding-top:6px;flex:none}
  .lg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mute);font-weight:600}
  .lg i{width:11px;height:11px;border-radius:3px;display:block;border:1px solid rgba(255,255,255,.28)}
  .toast{position:absolute;left:12px;bottom:12px;max-width:60%;background:rgba(8,18,34,.95);
    border:1px solid var(--gold);border-left-width:4px;border-radius:9px;padding:8px 12px;z-index:8;
    opacity:0;transform:translateY(8px);transition:all .4s ease;pointer-events:none}
  .toast.on{opacity:1;transform:none}
  .toast .tt{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:2px}
  .toast .tb{font-size:10.5px;color:var(--ice);line-height:1.5}
  .toast.ok{border-color:var(--teal)} .toast.ok .tt{color:var(--teal2)}
  .hint{position:absolute;right:12px;top:10px;font-size:10px;color:var(--mute);background:rgba(8,18,34,.85);
    padding:4px 10px;border-radius:20px;border:1px solid var(--line);z-index:7}

  .badge{width:32px;height:32px;border-radius:9px;background:var(--red);display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:15px;color:#fff;flex:none}
  .pts{list-style:none;overflow:auto;flex:1}
  .pts li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;opacity:0;transform:translateY(6px)}
  .pts li.show{opacity:1;transform:none;transition:all .5s ease}
  .pts li .pk{width:6px;height:6px;border-radius:2px;background:var(--teal);margin-top:6px;flex:none}
  .pts li .pt{font-size:12px;line-height:1.55;color:#EDF3FB}
  .pts li .pt b{color:#fff}
  .sys{flex:none;margin-top:5px;padding-top:5px;border-top:1px solid var(--line);display:flex;gap:5px;flex-wrap:wrap}
  .sy{font-size:10px;font-weight:700;color:var(--ice);background:#132844;border:1px solid #3A5A82;
    padding:3px 8px;border-radius:6px}
  .sy em{color:var(--teal2);font-style:normal;font-weight:800}

  .vlist{list-style:none;overflow:auto;flex:1}
  .vlist li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;margin-bottom:4px;
    background:rgba(14,28,51,.6);border:1px solid var(--line);transition:all .4s}
  .vlist li.foc{border-color:var(--red);background:rgba(226,35,26,.1);box-shadow:0 0 0 3px rgba(226,35,26,.08)}
  .vlist li.gone{opacity:.42}
  .vlist .sw{width:8px;height:24px;border-radius:3px;flex:none}
  .vlist .pl2{font-size:11.5px;font-weight:800;color:#fff;font-family:"Arial Narrow",Arial,sans-serif}
  .vlist .bz{font-size:9.5px;color:var(--mute);margin-top:1px}
  .vlist .v2{text-align:right;flex:none}
  .vlist .sg2{font-size:10.5px;font-weight:800;color:var(--teal2)}
  .vlist .tm{font-size:9px;color:var(--mute);margin-top:1px}

  .tf{list-style:none;overflow:auto;flex:1}
  .tf li{display:flex;gap:8px;align-items:flex-start;padding:5px 7px;border-radius:8px;margin-bottom:4px;
    background:rgba(14,28,51,.55);border:1px solid var(--line)}
  .tf li .sq{width:18px;height:18px;border-radius:5px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:9.5px;font-weight:800;background:var(--navy3);color:var(--mute)}
  .tf li .n1{font-size:11.5px;font-weight:800;color:#EDF3FB;line-height:1.3}
  .tf li .n2{font-size:9.5px;color:var(--mute);margin-top:1px}
  .tf li .st{font-size:9px;font-weight:800;color:var(--mute);margin-left:auto;flex:none}
  .tf li.done{border-color:rgba(26,160,133,.5);background:rgba(26,160,133,.08)}
  .tf li.done .sq{background:var(--teal);color:#fff} .tf li.done .st{color:var(--teal2)}
  .tf li.act{border-color:var(--red);background:rgba(226,35,26,.1)}
  .tf li.act .sq{background:var(--red);color:#fff} .tf li.act .st{color:#ff8b84} .tf li.act .n1{color:#fff}

  /* ============ 全屏演示 ============ */
  #vFull{grid-template-columns:1fr minmax(320px,24%);gap:12px}
  body.fullview .kpis{display:none}
  body.fullview .note{display:none}
  body.fullview .stage{padding:9px 16px 4px}
  body.fullview .tlx{min-width:54px;padding:4px 3px}
  #vFull .mapbox{min-height:320px;border-radius:12px;flex:1}
  #vFull .toast{max-width:52%;left:14px;bottom:14px}
  #vFull .toast .tt{font-size:12.5px} #vFull .toast .tb{font-size:11.5px;line-height:1.55}
  .narr{background:linear-gradient(180deg,rgba(30,53,89,.5),rgba(20,38,66,.32));border:1px solid var(--line);
    border-radius:13px;padding:12px 13px;display:flex;flex-direction:column;min-height:0;overflow:auto}
  .nhead{display:flex;gap:10px;align-items:flex-start;flex:none;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .nno{width:40px;height:40px;border-radius:11px;background:var(--red);color:#fff;font-size:19px;
    font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .ntime{font-size:9px;color:var(--teal);font-weight:700;letter-spacing:1px}
  .nname{font-size:15.5px;font-weight:800;line-height:1.25;margin-top:2px}
  .nzone{font-size:10px;color:var(--mute);margin-top:2px}
  .nfoc{margin-top:10px;flex:none;background:rgba(226,35,26,.1);border:1px solid rgba(226,35,26,.42);
    border-radius:9px;padding:7px 10px}
  .nfoc .fl{font-size:9px;color:#ff8b84;font-weight:800}
  .nfoc .fp{font-size:13.5px;font-weight:800;color:#fff;font-family:"Arial Narrow",Arial,sans-serif;margin-top:2px}
  .nfoc .fb{font-size:10px;color:var(--ice);margin-top:2px;line-height:1.45}
  .nlab{font-size:9px;color:var(--teal);font-weight:800;letter-spacing:1px;margin:11px 0 5px;flex:none}
  .npts{list-style:none;flex:none}
  .npts li{display:flex;gap:7px;align-items:flex-start;padding:4px 0;opacity:0;transform:translateY(7px)}
  .npts li.show{opacity:1;transform:none;transition:all .55s ease}
  .npts li .pk{width:6px;height:6px;border-radius:2px;background:var(--teal);margin-top:6px;flex:none}
  .npts li .pt{font-size:12px;line-height:1.55;color:#EDF3FB}
  .npts li .pt b{color:#fff;display:block;margin-bottom:1px}
  .nsys{display:flex;gap:5px;flex-wrap:wrap;flex:none}
  .nvl{list-style:none;flex:none}
  .nvl li{display:flex;gap:7px;align-items:center;padding:5px 6px;border-radius:7px;margin-bottom:4px;
    background:rgba(14,28,51,.6);border:1px solid var(--line);transition:all .4s}
  .nvl li.foc{border-color:var(--red);background:rgba(226,35,26,.1)}
  .nvl li.gone{opacity:.42}
  .nvl .sw{width:7px;height:22px;border-radius:3px;flex:none}
  .nvl .p1{font-size:10.5px;font-weight:800;color:#fff;font-family:"Arial Narrow",Arial,sans-serif}
  .nvl .p2{font-size:8.5px;color:var(--mute);margin-top:1px}
  .nvl .p3{margin-left:auto;text-align:right;flex:none}
  .nvl .p3 b{display:block;font-size:10px;font-weight:800;color:var(--teal2)}
  .nvl .p3 i{font-style:normal;font-size:8.5px;color:var(--mute)}
  .nlg{margin-top:auto;padding-top:10px;display:flex;gap:8px;flex-wrap:wrap;flex:none}
  .nlg span{display:flex;align-items:center;gap:4px;font-size:8.5px;color:var(--mute)}
  .nlg i{width:8px;height:8px;border-radius:2px;display:block}
  .nfootnote{padding-top:7px;font-size:8.5px;color:#5E7799;line-height:1.5;flex:none}

  /* ============ 司机端 ============ */
  #vDrv{grid-template-columns:1fr;overflow:auto}
  .dvwrap{display:flex;flex-direction:column;min-height:0;gap:10px}
  .dvtop{display:flex;align-items:center;gap:12px;flex:none}
  .dvtop .dt{font-size:14px;font-weight:800}
  .dvtop .ds2{font-size:10px;color:var(--mute)}
  .dvstep{margin-left:auto;flex:none;font-size:11.5px;font-weight:800;color:#fff;
    background:var(--red);padding:6px 13px;border-radius:20px;white-space:nowrap}
  .dvtop .dr{flex:none;margin-left:11px;font-size:10px;color:var(--teal2);font-weight:700}
  .phones{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;flex:1;min-height:0;align-items:start;overflow:auto}
  .ph{display:flex;flex-direction:column;gap:6px;min-width:0}
  .phbox{aspect-ratio:200/420;width:100%;flex:none;border-radius:15px;border:2px solid var(--navy3);
    background:#0B1A2E;padding:5px;display:flex;flex-direction:column;transition:all .45s;
    position:relative;overflow:hidden}
  .ph.act .phbox{border-color:var(--red);box-shadow:0 0 0 3px rgba(226,35,26,.18),0 6px 16px rgba(0,0,0,.4)}
  .ph.act .phcap{color:#fff}
  .ph:not(.act) .phbox{opacity:.62}
  .phnotch{height:8px;display:flex;align-items:center;justify-content:center;flex:none}
  .phnotch i{width:26px;height:3px;border-radius:2px;background:var(--navy3);display:block}
  .scr{flex:1;min-height:0;border-radius:10px;background:#F4F8FF;color:#16233A;display:flex;
    flex-direction:column;overflow:hidden}
  .sbar{background:#1E3559;color:#fff;padding:4px 6px;display:flex;align-items:center;gap:4px;flex:none}
  .sbar .st3{font-size:8px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sbar .sn{font-size:7px;color:#8AA0BE}
  .sbody{flex:1;padding:5px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
  .fld{background:#fff;border:1px solid #E1E8F0;border-radius:5px;padding:3px 5px}
  .fld .fk{font-size:6.5px;color:#8494A8;font-weight:700}
  .fld .fv{font-size:8px;color:#16233A;font-weight:700;margin-top:1px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .btnp{background:var(--red);color:#fff;border-radius:5px;text-align:center;padding:4px;
    font-size:8px;font-weight:800;margin-top:auto;flex:none}
  .btnp.gr{background:var(--teal)} .btnp.gy{background:#B9C7D8;color:#4A5F80}
  .tagp{display:inline-block;font-size:6.5px;font-weight:800;padding:1px 5px;border-radius:8px;
    background:#ECF7F3;color:#0E7A63}
  .tagp.w{background:#FFF6E8;color:#9A6A12} .tagp.r{background:#FDECEB;color:#C11A12}
  .qcard{background:#1E3559;border-radius:6px;padding:5px;color:#fff;text-align:center;flex:none}
  .qcard .qn{font-size:19px;font-weight:800;font-family:"Arial Narrow",Arial,sans-serif;line-height:1}
  .qcard .ql{font-size:6.5px;color:#9AB4D4;margin-top:1px}
  .qr{width:100%;aspect-ratio:1;background:
      repeating-conic-gradient(#16233A 0% 25%, #fff 0% 50%) 0 0/6px 6px;border-radius:4px;flex:none;
      border:3px solid #fff}
  .minimap{flex:1;min-height:0;border-radius:5px;background:#E8EFF7;position:relative;overflow:hidden}
  .minimap i{position:absolute;background:#C7D6E6;border-radius:1px}
  .minimap .pin{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(226,35,26,.28)}
  .minimap .rt{position:absolute;height:2px;background:var(--red);border-radius:2px}
  .rowp{display:flex;gap:3px;align-items:center;font-size:7px}
  .rowp b{font-weight:800}
  .tkl{display:flex;flex-direction:column;gap:3px}
  .tkl .tk{display:flex;gap:3px;align-items:center;background:#fff;border:1px solid #E1E8F0;
    border-radius:4px;padding:2px 4px}
  .tkl .tk .tn2{width:11px;height:11px;border-radius:3px;background:#B9C7D8;color:#fff;font-size:6.5px;
    font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .tkl .tk.on .tn2{background:var(--red)} .tkl .tk.dn .tn2{background:var(--teal)}
  .tkl .tk .tt3{font-size:7px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tkl .tk .ts3{font-size:6.5px;color:#8494A8}
  .phcap{font-size:9.5px;font-weight:800;color:var(--ice);text-align:center;flex:none;line-height:1.3}
  .phcap i{display:block;font-style:normal;font-size:8px;color:var(--mute);font-weight:400;margin-top:1px}
  .phcap b{display:block;font-size:8.5px;color:#FFCE8A;font-weight:800;margin-top:2px}
  .ph.act .phcap b{color:#fff}
  .phbox .now{position:absolute;right:6px;top:6px;background:var(--red);color:#fff;font-size:8px;
    font-weight:800;padding:1px 6px;border-radius:9px;opacity:0;transition:opacity .3s;z-index:4}
  .ph.act .phbox .now{opacity:1}
  .dvdet{flex:none;background:linear-gradient(180deg,rgba(30,53,89,.44),rgba(20,38,66,.28));
    border:1px solid var(--line);border-radius:12px;padding:10px 13px;display:flex;gap:16px}
  .dvdet .dl{flex:none;width:150px}
  .dvdet .dl .dn2{font-size:13.5px;font-weight:800;color:#fff}
  .dvdet .dl .dz{font-size:9.5px;color:var(--teal2);font-weight:700;margin-top:2px}
  .dvdet .dc2{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .dvdet .di{font-size:10.5px;color:#E7EFFA;line-height:1.5}
  .dvdet .di b{color:#fff;display:block;font-size:11px;margin-bottom:1px}

  /* ============ 系统功能清单 ============ */
  #vFunc{grid-template-columns:1fr;overflow:hidden}
  .fwrap{display:flex;flex-direction:column;min-height:0;gap:10px}
  .fhead{flex:none;display:flex;align-items:flex-end;gap:12px}
  .fhead .fh1{font-size:16px;font-weight:800;color:#fff}
  .fhead .fh2{font-size:10px;color:var(--mute);margin-top:2px}
  .fsum{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;flex:none}
  .fs{background:rgba(14,28,51,.7);border:1px solid var(--line);border-radius:10px;padding:7px 11px}
  .fs .k{font-size:9.5px;color:var(--mute);font-weight:700}
  .fs .v{font-size:22px;font-weight:800;line-height:1.2;margin-top:1px;
    font-family:"Arial Narrow",Arial,sans-serif}
  .fmain{flex:1;min-height:0;display:grid;grid-template-columns:184px 1fr;gap:11px}
  .fnav{display:flex;flex-direction:column;gap:5px;overflow:auto;padding-right:2px}
  .fnav button{background:rgba(14,28,51,.65);border:1px solid var(--line);border-radius:9px;
    color:var(--ice);font:inherit;font-size:12.5px;font-weight:700;padding:8px 11px;cursor:pointer;
    text-align:left;transition:all .2s;display:flex;align-items:center;gap:7px}
  .fnav button:hover{border-color:var(--teal)}
  .fnav button.on{background:var(--red);border-color:var(--red);color:#fff}
  .fnav button i{font-style:normal;font-size:11px;color:var(--mute);margin-left:auto}
  .fnav button.on i{color:#ffd3d0}
  .fbody{overflow:auto;min-height:0;padding-right:4px}
  .fbody.all{column-count:3;column-gap:11px}
  .fcard{background:linear-gradient(180deg,rgba(30,53,89,.5),rgba(20,38,66,.3));
    border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:11px;
    break-inside:avoid}
  .fch{display:flex;align-items:center;gap:7px;padding-bottom:6px;margin-bottom:6px;
    border-bottom:1px solid var(--line)}
  .fch .l1{font-size:13px;font-weight:800;color:#fff}
  .fch .ct{margin-left:auto;font-size:9.5px;color:var(--mute);font-weight:700}
  .fg2{font-size:10.5px;font-weight:800;color:var(--teal2);margin:6px 0 4px;
    display:flex;align-items:center;gap:5px}
  .fg2:before{content:"";width:5px;height:5px;border-radius:1px;background:var(--teal2)}
  .fitem{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;color:#DCE9F7}
  .fitem .dot{width:4px;height:4px;border-radius:50%;background:#5E7799;flex:none}
  .fitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function h(a,b){ var x=Math.sin(a*127.1+b*311.7)*43758.5453; return x-Math.floor(x); }
function queueFor(gi,i,step,min){
  // 该月台已预约 / 已签到、正在排队等待进入的车辆
  var r=h(gi*29+i, step+11), n=(r<0.30?0:(r<0.72?1:2));
  if(min && n<min) n=min;
  var q=[];
  for(var m=0;m<n;m++){
    q.push({pl:BGPLATE[(gi*7+i*3+m+step)%BGPLATE.length],
            wait:Math.floor(h(gi+i*5+m,step)*26)+4,
            gate:(gi<2?"西门":"东门")});
  }
  return q;
}
function dockState(gi,i,step){
  var r=h(gi*13+i, step+5);
  if(r<0.56) return {s:"busy",pl:BGPLATE[(gi*6+i+step)%BGPLATE.length],bz:BGBIZ[(gi*3+i)%BGBIZ.length],
    pg:Math.floor(h(i,step)*80)+15,du:Math.floor(h(i+3,step)*70)+8,q:queueFor(gi,i,step,0)};
  if(r<0.64) return {s:"over",pl:BGPLATE[(gi*4+i+step)%BGPLATE.length],bz:BGBIZ[(gi+i)%BGBIZ.length],
    pg:92,du:Math.floor(h(i+7,step)*30)+125,q:queueFor(gi,i,step,1)};
  if(r<0.72) return {s:"lock",pl:"—",bz:"已预锁待入",pg:0,du:0,q:queueFor(gi,i,step,1)};
  return {s:"idle",pl:"—",bz:"空闲",pg:0,du:0,q:queueFor(gi,i,step,0)};

/* ---------- 行驶轨迹（带箭头，与车辆同色） ---------- */
function trailPts(v,i,k){
  var out=[];
  for(var j=v.enterIdx;j<=k;j++){
    var pa=v.stages[j].path||[];
    for(var q=0;q<pa.length;q++){
      var p=pa[q];
      var py=sy(p[1]);
      if(!out.length || Math.abs(out[out.length-1][0]-p[0])>0.5 || Math.abs(out[out.length-1][1]-py)>0.5)
        out.push([p[0],py]);
    }
  }
  return out;
}
/* 轨迹侧向偏移：按"道路轴向"固定分道（与行驶方向无关），保证任意两车在同一
   路段上都并排显示；再叠加 ±1 的方向微偏移，使同一辆车的往返也能区分。
   竖向路段左右错开，横向路段上下错开（竖直分量按 SY 同步压缩） */
var TRAIL_OFF = [-10.5, -3.5, 3.5, 10.5];
var TRAIL_SUB = 2.2;

/* 两条偏移段所在直线的交点（平行 / 反向时返回 null） */
function lineX(s1,s2){
  var x1=s1.a[0],y1=s1.a[1],x2=s1.b[0],y2=s1.b[1];
  var x3=s2.a[0],y3=s2.a[1],x4=s2.b[0],y4=s2.b[1];
  var den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if(Math.abs(den)<1e-6) return null;
  var t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/den;
  // 交点离段末过远说明并非真实拐角，放弃
  if(t<-2.5||t>3.5) return null;
  return [x1+t*(x2-x1), y1+t*(y2-y1)];
}
/* 由偏移段序列求折线顶点：拐角用交点，掉头用原两端点 */
function buildVerts(segs){
  var V=[[segs[0].a[0],segs[0].a[1]]];
  for(var i=0;i<segs.length-1;i++){
    var p=lineX(segs[i],segs[i+1]);
    if(p) V.push(p);
    else { V.push([segs[i].b[0],segs[i].b[1]]); V.push([segs[i+1].a[0],segs[i+1].a[1]]); }
  }
  var lastSeg=segs[segs.length-1];
  V.push([lastSeg.b[0],lastSeg.b[1]]);
  // 合并重复点
  var out=[V[0]];
  for(var k=1;k<V.length;k++){
    var q=out[out.length-1];
    if(Math.abs(V[k][0]-q[0])>0.4||Math.abs(V[k][1]-q[1])>0.4) out.push(V[k]);
  }
  return out;
}
/* 折线倒圆角：拐角以二次贝塞尔过渡，线条连续平滑 */
function roundPath(V,r){
  function fx(p){ return p[0].toFixed(1)+" "+p[1].toFixed(1); }
  function lerp(p,q,t){ return [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t]; }
  function dist(p,q){ var dx=q[0]-p[0],dy=q[1]-p[1]; return Math.sqrt(dx*dx+dy*dy); }
  if(V.length<3) return "M"+fx(V[0])+" L"+fx(V[V.length-1]);
  var d="M"+fx(V[0]);
  for(var i=1;i<V.length-1;i++){
    var p0=V[i-1],p1=V[i],p2=V[i+1];
    var l1=dist(p0,p1), l2=dist(p1,p2);
    // 近似共线则不倒角
    var c=((p1[0]-p0[0])*(p2[0]-p1[0])+(p1[1]-p0[1])*(p2[1]-p1[1]))/((l1*l2)||1);
    var rr=Math.min(r, l1*0.45, l2*0.45);
    if(c>0.985 || rr<1.5){ d+=" L"+fx(p1); continue; }
    d+=" L"+fx(lerp(p1,p0,rr/l1))+" Q"+fx(p1)+" "+fx(lerp(p1,p2,rr/l2));
  }
  return d+" L"+fx(V[V.length-1]);
}

function drawTrails(s){
  var L=$("tlayer"); L.innerHTML="";
  VEH.forEach(function(v,i){
    var k=s.ix[i];
    if(k<0) k=v.stages.length-1;                 // 已离场：保留完整轨迹
    if(k<v.enterIdx) return;                     // 未入园：不画
    var pts=trailPts(v,i,k);
    if(pts.length<2) return;
    var foc=(i===s.f), off=TRAIL_OFF[i]||0;

    // 逐段按道路轴向分道偏移
    var segs=[];
    for(var q=1;q<pts.length;q++){
      var a=pts[q-1], b=pts[q];
      var dx=b[0]-a[0], dy=b[1]-a[1], len=Math.sqrt(dx*dx+dy*dy);
      if(len<0.8) continue;
      var vert=Math.abs(dx)<Math.abs(dy);
      var dir=vert?(dy>0?1:-1):(dx>0?1:-1);
      var tot=off+dir*TRAIL_SUB;
      var ox=vert?tot:0, oy=vert?0:tot*SY;
      segs.push({a:[a[0]+ox,a[1]+oy], b:[b[0]+ox,b[1]+oy], len:len,
                 ang:Math.atan2(dy,dx)*180/Math.PI});
    }
    if(!segs.length) return;

    // 先求相邻偏移段的交点作为拐角顶点，再以二次贝塞尔倒圆角
    var V=buildVerts(segs);
    var d=roundPath(V,11);

    // 底衬（深色描边）提升在地图上的可读性
    L.appendChild(el("path",{d:d,stroke:"#04101E","stroke-width":foc?9.5:8,
      "stroke-opacity":.78,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"}));
    var ln=el("path",{d:d,stroke:v.color,"stroke-width":foc?5:4,
      "stroke-opacity":foc?1:.82,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"});
    ln.setAttribute("class","trail"); L.appendChild(ln);

    // 沿途方向箭头：按顶点序列的直线段放置，避开圆角区
    for(var vi=1;vi<V.length;vi++){
      var p0=V[vi-1], p1=V[vi];
      var sdx=p1[0]-p0[0], sdy=p1[1]-p0[1], slen=Math.sqrt(sdx*sdx+sdy*sdy);
      if(slen<34) continue;
      var sang=Math.atan2(sdy,sdx)*180/Math.PI;
      var n=Math.max(1,Math.floor(slen/95));
      // 往返方向的箭头错开相位，避免同一路段上下箭头叠在一起
      var vv=Math.abs(sdx)<Math.abs(sdy);
      var ph=((vv?sdy:sdx)>0)?0:0.42;
      for(var m=1;m<=n;m++){
        var f=Math.min(0.94,(m+ph)/(n+1));
        var mx=p0[0]+sdx*f, my=p0[1]+sdy*f;
        L.appendChild(el("path",{d:"M-8 -7.5 L9.5 0 L-8 7.5 Z",fill:v.color,
          "fill-opacity":foc?1:.85,stroke:"#04101E","stroke-width":1.5,
          transform:"translate("+mx.toFixed(1)+","+my.toFixed(1)+") rotate("+sang.toFixed(1)+")"}));
      }
    }

    // 末端箭头（当前朝向）
    var vE=V[V.length-1], vP=V[V.length-2];
    var eang=Math.atan2(vE[1]-vP[1],vE[0]-vP[0])*180/Math.PI;
    L.appendChild(el("path",{d:"M-10.5 -9.5 L12.5 0 L-10.5 9.5 Z",fill:v.color,

/* 行驶速度模型：地图 1 单位 ≈ 1 m（竖向已按 SY 压缩，算里程时还原）。
   园区限速 YARD_KMH，按演示时间压缩倍数 TIME_FOLD 折算为屏幕速度；
   播放档位越慢，屏幕速度同比放慢。
   整条路径用 rAF 连续插值，只在起步与到位各做一次加减速，
   中间所有转折点保持匀速通过，不再逐段缓入缓出。 */
var YARD_KMH = 20;      // 园区限速（km/h）
var TIME_FOLD = 29;     // 演示时间压缩倍数（慢速 1× 档基准）
var ACC_F = 0.18, DEC_F = 0.20;   // 起步加速段 / 到位减速段占全程时间比例
function speedUPS(){ return (YARD_KMH/3.6)*TIME_FOLD*(5400/interval); }

/* 梯形速度曲线：起步加速 → 全程匀速 → 到位减速，返回已行驶里程占比 */
function speedProfile(u){
  var a=ACC_F, d=DEC_F, v=1/(1-(a+d)/2);
  if(u<a) return v*u*u/(2*a);
  if(u>1-d) return 1-v*(1-u)*(1-u)/(2*d);
  return v*(a/2+(u-a));
}
function stopVeh(i){
  if(rafT[i]){ cancelAnimationFrame(rafT[i]); rafT[i]=null; }
  clearTimeout(moveT[i]);
  var nd=vnodes[i];
  if(nd){ nd.wrap.classList.remove("mv"); nd.wrap.style.transition=""; }
}
function placeVeh(i,x,y){
  var nd=vnodes[i];
  nd.wrap.style.transition="none";
  nd.cur=[x,y];
  nd.wrap.style.transform="translate("+x+"px,"+y+"px)";
  // 强制回流后恢复过渡属性，避免下次动画被残留状态影响
  void nd.wrap.getBoundingClientRect();
  nd.wrap.style.transition="";
}
function moveVeh(i,path,budget){
  stopVeh(i);
  var nd=vnodes[i];
  if(!path||!path.length) return;
  // 组装完整折线（起点为当前位置），并剔除重复点
  var pts=[[nd.cur[0],nd.cur[1]]];
  for(var q=0;q<path.length;q++){
    var px=path[q][0], py=sy(path[q][1]), lp=pts[pts.length-1];
    if(Math.abs(px-lp[0])>0.3||Math.abs(py-lp[1])>0.3) pts.push([px,py]);
  }
  if(pts.length<2) return;
  // 分段长度：屏幕长度用于插值，真实里程用于计时
  var segL=[], totalS=0, totalM=0;
  for(q=1;q<pts.length;q++){
    var dx=pts[q][0]-pts[q-1][0], dy=pts[q][1]-pts[q-1][1];
    var sl=Math.sqrt(dx*dx+dy*dy);
    segL.push(sl); totalS+=sl;
    totalM+=Math.sqrt(dx*dx+(dy/SY)*(dy/SY));
  }
  if(totalS<0.6){ placeVeh(i,pts[pts.length-1][0],pts[pts.length-1][1]); return; }
  var dur=Math.max(800,Math.min(budget,totalM/speedUPS()*1000));
  nd.wrap.style.transition="none";
  nd.wrap.classList.add("mv");
  var t0=null;
  function frame(ts){
    if(t0===null) t0=ts;
    var u=Math.min(1,(ts-t0)/dur);
    var target=speedProfile(u)*totalS;
    var acc=0,k=0;
    while(k<segL.length-1 && acc+segL[k]<=target){ acc+=segL[k]; k++; }
    var f=segL[k]>0?Math.min(1,Math.max(0,(target-acc)/segL[k])):1;
    var x=pts[k][0]+(pts[k+1][0]-pts[k][0])*f;
    var y=pts[k][1]+(pts[k+1][1]-pts[k][1])*f;
    nd.cur=[x,y];
    nd.wrap.style.transform="translate("+x+"px,"+y+"px)";
    // 车头朝向：取当前所在段的真实方向角，按最短弧转向（避免绕大圈或翻转）
    var sdx=pts[k+1][0]-pts[k][0], sdy=pts[k+1][1]-pts[k][1];
    if(Math.abs(sdx)>2||Math.abs(sdy)>2){
      var raw=Math.atan2(sdy,sdx)*180/Math.PI;
      var diff=((raw-nd.angle+540)%360)-180;
      if(Math.abs(diff)>0.5){
        nd.angle+=diff;
        nd.bd.style.transform="rotate("+nd.angle.toFixed(1)+"deg)";
      }
    }
    if(u<1) rafT[i]=requestAnimationFrame(frame);
    else {
      var last=pts[pts.length-1];
      nd.cur=[last[0],last[1]];
      nd.wrap.classList.remove("mv");
      nd.wrap.style.transition="";
      rafT[i]=null;
    }
  }
  rafT[i]=requestAnimationFrame(frame);
}

function buildTL(){
  var t=$("tl"); t.innerHTML="";

    d.innerHTML='<div class="tn">'+s.t+'</div><div class="tt2">'+s.n.split(" · ")[0]+'</div>';

    t.appendChild(d);
  });
  $("indAll").textContent=TL.length;
}
function go(i){
  var p=idx;
  idx=Math.max(0,Math.min(TL.length-1,i));
  renderSim(p);
}
function next(){ if(idx>=TL.length-1){ idx=0; renderSim(); } else go(idx+1); }
function play(){ playing=true; document.body.classList.add("playing"); $("hint").style.display="";
  $("play").textContent="⏸ 暂停"; clearInterval(timer); timer=setInterval(next,interval); }
function pause(){ playing=false; document.body.classList.remove("playing"); $("hint").style.display="none";
  $("play").textContent="▶ 播放"; clearInterval(timer); }

$("play").addEventListener("click",function(){ playing?pause():play(); });
$("next").addEventListener("click",function(){ next(); pause(); });
$("prev").addEventListener("click",function(){ go(idx-1); pause(); });
$("restart").addEventListener("click",function(){ go(0); play(); });
$("bar").addEventListener("click",function(e){

  go(Math.round(((e.clientX-r.left)/r.width)*(TL.length-1))); pause();
});

});

    document.body.classList.toggle("nosteps",view==="vFunc"||view==="vCtl");
    document.body.classList.toggle("funcview",view==="vFunc");
    var host=(view==="vFull")?$("mapHostFull"):$("mapHost");
    if($("mapbox").parentNode!==host) host.appendChild($("mapbox"));
    if(view==="vDock"||view==="vCtl"||view==="vGate") animBars();
  });
});
document.addEventListener("keydown",function(e){
  if(e.code==="KeyF"){
    var tgt=(view==="vFull")?"vSim":"vFull";
    var btn=$("views").querySelector('button[data-v="'+tgt+'"]');
    if(btn) btn.click();
    return;
  }
  if(e.code==="KeyD"){
    var b2=$("views").querySelector('button[data-v="vDrv"]');
    if(b2) b2.click();
    return;
  }
  if(e.code==="Space"){ e.preventDefault(); playing?pause():play(); }
  else if(e.code==="ArrowRight"){ next(); pause(); }
  else if(e.code==="ArrowLeft"){ go(idx-1); pause(); }
});

/* ---------- 初始化 ---------- */
buildMap(); buildVeh(); buildTL(); buildDrv(); buildCtl(); renderFunc(); renderSim();
if(reduce) pause(); else play();
})();

/* 底图渲染：layers 控制叠加层，缺省全开；各模块按需关闭
   {plan:规划线, redx:卸货口, blue:内部转运口, docks:月台组, wb:地磅, pts:作业点/等候位} */
CP.core.map.svg=function(o){
  o=o||{};var m=CP.core.map,sy=m.sy,C=m.C,R=m.R;
  var L=o.layers||{},on=function(k){return L[k]!==false};
  var T=function(x,y,txt,at){                      /* 带描边光晕的文字 */
    return '<text x="'+x+'" y="'+y+'" font-size="'+at.fs+'" font-weight="'+(at.fw||800)
     +'" text-anchor="'+(at.ta||'middle')+'"'+(at.db?' dominant-baseline="central"':'')
     +' fill="'+at.f+'" paint-order="stroke" stroke="'+C.halo+'" stroke-width="'+(at.sw||4)+'"'
     +(at.ls?' letter-spacing="'+at.ls+'"':'')+(at.tr?' transform="'+at.tr+'"':'')
     +'>'+txt+'</text>';
  };
  var s='<svg viewBox="0 0 1265 '+m.VB_H+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<rect x="0" y="0" width="1265" height="'+m.VB_H+'" fill="'+C.bg+'"/>';
  /* 围墙 + 绿化带 */
  s+='<rect x="60" y="'+sy(60).toFixed(1)+'" width="1147" height="'+sy(1128).toFixed(1)
   +'" rx="6" fill="'+C.wall+'" stroke="'+C.wallStk+'" stroke-width="2.6"/>'
   +'<rect x="66" y="'+sy(66).toFixed(1)+'" width="1135" height="'+sy(1116).toFixed(1)
   +'" rx="4" fill="none" stroke="'+C.green+'" stroke-width="8" stroke-opacity=".85"/>';
  /* 道路：三级配色 + 主路中心黄虚线 + 名称 */
  m.ROADS.forEach(function(r){
    var ry=sy(r.y),rh=sy(r.h);
    s+='<rect x="'+r.x+'" y="'+ry.toFixed(1)+'" width="'+r.w+'" height="'+rh.toFixed(1)
     +'" rx="3" fill="'+(r.pub?C.roadPub:(r.main?C.roadMain:C.roadSub))
     +'" stroke="'+(r.pub?C.roadPubStk:(r.main?C.roadMainStk:C.roadSubStk))
     +'" stroke-width="'+(r.main?1.8:1.3)+'"/>';
    if(r.main){
      if(r.vt)s+='<line x1="'+(r.x+r.w/2)+'" y1="'+(ry+8).toFixed(1)+'" x2="'+(r.x+r.w/2)
        +'" y2="'+(ry+rh-8).toFixed(1)+'" stroke="'+C.center
        +'" stroke-width="2.6" stroke-dasharray="14 11" stroke-opacity=".7"/>';
      else s+='<line x1="'+(r.x+10)+'" y1="'+(ry+rh/2).toFixed(1)+'" x2="'+(r.x+r.w-10)
        +'" y2="'+(ry+rh/2).toFixed(1)+'" stroke="'+C.center
        +'" stroke-width="2.6" stroke-dasharray="16 13" stroke-opacity=".7"/>';
    }
    if(r.n){
      var cx=r.x+r.w*(r.lfx!==undefined?r.lfx:0.5),cy=ry+rh*(r.lfy!==undefined?r.lfy:0.5);
      s+=T(cx.toFixed(1),cy.toFixed(1),r.n,{fs:17,f:C.roadTxt,db:1,ls:1,
        tr:r.vt?('rotate(-90 '+cx.toFixed(1)+' '+cy.toFixed(1)+')'):null});
    }
  });
  /* 行车道规划线 */
  if(on('plan'))m.PLAN.forEach(function(p){
    var d='M'+p.pts[0][0]+' '+sy(p.pts[0][1]).toFixed(1);
    for(var i=1;i<p.pts.length;i++)d+=' L'+p.pts[i][0]+' '+sy(p.pts[i][1]).toFixed(1);
    s+='<path d="'+d+'" fill="none" stroke="'+p.c+'" stroke-width="'+p.w
     +'" stroke-dasharray="'+p.dash+'" stroke-opacity="'+p.o+'" stroke-linecap="round"/>';
  });
  /* 建筑 */
  m.BLD.forEach(function(b){
    var by=sy(b.y),bh=sy(b.h),hl=(o.hlBld&&o.hlBld===b.n);
    s+='<rect x="'+b.x+'" y="'+by.toFixed(1)+'" width="'+b.w+'" height="'+bh.toFixed(1)
     +'" rx="4" fill="'+m.FILL[b.t]+'" stroke="'+(hl?'#FF6B62':m.STK[b.t])
     +'" stroke-width="'+(hl?3.6:(b.t==='plant'?2.4:1.6))
     +'" stroke-dasharray="'+(b.t==='rsv'?'8 5':(b.t==='podium'?'6 4':'none'))+'"/>';
    var cx=b.x+b.w/2,cy=by+bh/2,small=(b.w<90||bh<40);
    if(b.t==='podium'){                       /* 共裙楼：左上角标注，中心留给塔楼 */
      s+=T(b.x+8,(by+15).toFixed(1),b.n+' · '+b.sub,{fs:13,f:C.bldSub,ta:'start',sw:3.4});
    } else if(b.t==='dorm'&&b.w<60){          /* MF5–MF8 塔楼 */
      s+=T(cx,cy.toFixed(1),b.n,{fs:14,f:C.bldTxt,db:1,sw:3.4});
    } else if(b.sub){
      s+=T(cx,(cy-11).toFixed(1),b.n,{fs:22,f:C.bldTxt,db:1,sw:4.5})
       +T(cx,(cy+14).toFixed(1),b.sub,{fs:15,fw:700,f:C.bldSub,db:1,sw:3.6});
    } else {
      s+=T(cx,cy.toFixed(1),b.n,{fs:small?13:(b.t==='rsv'?19:20),
        f:b.t==='rsv'?C.rsvTxt:C.bldTxt,db:1,sw:small?3:4.2});
    }
    if(b.t==='yard')for(var c=0;c<6;c++)
      s+='<rect x="'+(b.x+14+(c%3)*28)+'" y="'+(by+(c<3?sy(80):sy(92))).toFixed(1)
       +'" width="22" height="6" rx="1" fill="'+C.yardCell+'"/>';
  });
  /* 卸货口（红） */
  if(on('redx'))m.REDX.forEach(function(d){
    s+='<rect x="'+d[0]+'" y="'+sy(d[1]).toFixed(1)+'" width="'+d[2]+'" height="'
     +Math.max(6,sy(d[3])).toFixed(1)+'" rx="2" fill="'+C.dock+'" stroke="'+C.dockStk
     +'" stroke-width="1.2"/>';
  });
  /* 内部转运专用月台口（蓝） */
  if(on('blue'))m.BLUE.forEach(function(b){
    s+='<rect x="'+b.x+'" y="'+sy(b.y).toFixed(1)+'" width="'+b.w+'" height="'
     +Math.max(6,sy(b.h)).toFixed(1)+'" rx="2" fill="'+C.blue+'" stroke="'+C.blueStk
     +'" stroke-width="1.4"/>';
  });
  /* 功能月台组 + 组名 */
  if(on('docks'))m.DGROUPS.forEach(function(gr){
    gr.cells.forEach(function(c){
      s+='<rect x="'+c[0]+'" y="'+sy(c[1]).toFixed(1)+'" width="'+c[2]+'" height="'
       +Math.max(8,sy(c[3])).toFixed(1)+'" rx="2" fill="'+C.dock+'" stroke="'+C.dockStk
       +'" stroke-width="1.2"/>';
    });
    var c0=gr.cells[0],left=(gr.tx<c0[0]);
    s+=T(left?(c0[0]-8):(c0[0]+c0[2]+8),(sy(c0[1])-8).toFixed(1),gr.name,
      {fs:13,f:C.dockTxt,ta:left?'end':'start',sw:3.6});
  });
  /* 堆场作业点 / 转场等候位 */
  if(on('pts')){
    var Y=m.YARDPT,Q=m.QPOINT;
    s+='<rect x="'+Y.x+'" y="'+sy(Y.y).toFixed(1)+'" width="'+Y.w+'" height="'
     +(sy(Y.h)+4).toFixed(1)+'" rx="4" fill="'+C.ptY+'" stroke="'+C.ptStk
     +'" stroke-width="1.8" stroke-dasharray="6 4"/>'
     +T(Y.x+Y.w/2,(sy(Y.y+Y.h/2)+2).toFixed(1),Y.n,{fs:13,f:C.wbTxt,db:1,sw:0.1})
     +'<rect x="'+Q.x+'" y="'+sy(Q.y).toFixed(1)+'" width="'+Q.w+'" height="'
     +(sy(Q.h)+4).toFixed(1)+'" rx="4" fill="'+C.ptQ+'" stroke="'+C.ptStk
     +'" stroke-width="2" stroke-dasharray="7 4"/>'
     +T(Q.x+Q.w/2,(sy(Q.y+Q.h/2)+2).toFixed(1),Q.n,{fs:12,f:C.ptQtxt,db:1,sw:3});
  }
  /* 地磅 */
  if(on('wb'))m.WB.forEach(function(w){
    s+='<rect x="'+w.x+'" y="'+sy(w.y).toFixed(1)+'" width="'+w.w+'" height="'
     +Math.max(10,sy(w.h)).toFixed(1)+'" rx="3" fill="#24406B" stroke="'+C.ptStk
     +'" stroke-width="1.6"/>'
     +T(w.x+w.w/2,(sy(w.y)+Math.max(10,sy(w.h))/2+3).toFixed(1),w.n,
       {fs:11,f:C.wbTxt,db:1,sw:2.6});
  });
  /* 门岗 7 个：矩形闸口 + 名称 + 角色 */
  m.GATES.forEach(function(t){
    var col=t.freight===2?C.g2:(t.freight===1?C.g1:C.g0);
    var vert=(t.lab==='L'||t.lab==='R'),w=vert?20:44,hh=vert?sy(52):16,ty0=sy(t.y);
    s+='<rect x="'+(t.x-w/2)+'" y="'+(ty0-hh/2).toFixed(1)+'" width="'+w+'" height="'
     +hh.toFixed(1)+'" rx="3" fill="'+C.gateBox+'" stroke="'+col+'" stroke-width="3"/>';
    var lt=(t.lab==='B')?(ty0-30):((t.lab==='T')?(ty0+28):(ty0-38));
    s+=T(t.x,lt.toFixed(1),t.n,{fs:16,f:t.freight?(t.freight===2?C.gt2:C.gt1):C.gt0,sw:4})
     +T(t.x,(lt+15).toFixed(1),t.r,{fs:11.5,fw:400,f:C.gr,sw:3});
  });
  /* 指北针 */
  s+=T(1160,sy(118).toFixed(1),'N',{fs:17,f:C.north,sw:0.1})
   +'<line x1="1160" y1="'+sy(126).toFixed(1)+'" x2="1160" y2="'+sy(180).toFixed(1)
   +'" stroke="'+C.northLn+'" stroke-width="2.4"/>'
   +'<path d="M1160 '+(sy(118)-14).toFixed(1)+' l-6 12 l12 0 z" fill="'+C.north+'"/>';
  if(o.extra)s+=o.extra;

};

CP.DOM.floors=function(b){
  var F=[];
  if(b.zone==='北区'){for(var i=1;i<=13;i++)F.push(i+'F');F.push('15F');}
  else {for(var j=1;j<=6;j++)F.push(j+'F');}
  return F.concat(b.ex);
};
/* 分层台数：按 PDF 可读前导数字推定（MF1=9 / MF2=8 / MF3=7 / MF4=7 每层），总计对齐 881 */
CP.DOM.perFloor={MF1:9,MF2:8,MF3:7,MF4:7,MF5:0,MF6:0,MF7:0,MF8:0};
CP.DOM.camOf=function(b,f){
  if(/^\d+F$/.test(f)&&b.zone==='北区')return CP.DOM.perFloor[b.id];
  var main=(b.zone==='北区')?CP.DOM.perFloor[b.id]*14:0;
  var rest=b.cam-main,n=b.ex.length||1;
  if(b.zone!=='北区'&&/^\d+F$/.test(f))return Math.round(b.cam*0.7/6);
  return Math.max(2,Math.round(rest/n));
};
/* 房型与床位（演示数据，待客户台账替换） */
CP.DOM.RT=[['四人间',4,12],['双人间',2,25],['单间',1,50]];
/* 确定性伪随机，保证每次渲染一致 */
CP.DOM.rnd=function(k){var h=2166136261;
  for(var i=0;i<k.length;i++){h^=k.charCodeAt(i);h=(h*16777619)>>>0}
  return (h%1000)/1000;};
CP.DOM.roomList=function(b,f){
  var out=[],n=(b.zone==='北区')?16:12;
  for(var i=1;i<=n;i++){
    var no=(parseInt(f)||1)*100+i,k=b.id+'-'+f+'-'+i,rv=CP.DOM.rnd(k);
    var rt=rv<0.72?CP.DOM.RT[0]:(rv<0.93?CP.DOM.RT[1]:CP.DOM.RT[2]);
    var st,occ;
    var r2=CP.DOM.rnd(k+'s');
    if(r2<0.06){st=['维修中','o'];occ=0}
    else if(r2<0.13){st=['待入住','b'];occ=0}
    else if(r2<0.28){st=['空房','d'];occ=0}
    else {st=['在住','g'];occ=Math.max(1,Math.round(rt[1]*(0.45+r2*0.55)))}
    out.push({no:b.id+'-'+no,type:rt[0],beds:rt[1],occ:Math.min(occ,rt[1]),
      sex:CP.DOM.rnd(k+'x')<0.72?'男':'女',st:st[0],c:st[1],price:rt[2]});
  }
  return out;
};
CP.DOM.sum=function(){
  var t={rooms:0,beds:0,occ:0,fix:0,wait:0,empty:0};
  CP.DOM.data.BLD.forEach(function(b){
    CP.DOM.floors(b).forEach(function(f){
      if(!/^\d+F$/.test(f))return;
      if(b.zone!=='北区'&&f==='1F')return;      /* MF5–MF8 一层为食堂/公共 */
      CP.DOM.roomList(b,f).forEach(function(r){
        t.rooms++;t.beds+=r.beds;t.occ+=r.occ;
        if(r.st==='维修中')t.fix++;else if(r.st==='待入住')t.wait++;
        else if(r.st==='空房')t.empty++;
      });
    });
  });
  return t;
};

CP.FIRE.devLayer=function(o){
  o=o||{};var sy=CP.core.map.sy,s='';
  CP.FIRE.data.DEV.forEach(function(d){
    if(o.only&&o.only.indexOf(d.t)<0)return;
    var st=(o.alarmDev===d.id)?'a':d.st,c=CP.FIRE.STC[st][1],cy=sy(d.y);
    if(st==='a')s+='<circle cx="'+d.x+'" cy="'+cy.toFixed(1)+'" r="7" fill="'+c
      +'" opacity=".45" class="cp-sec__pulse"/>';
    if(d.t==='FCC'){
      s+='<rect x="'+(d.x-9)+'" y="'+(cy-9).toFixed(1)+'" width="18" height="18" rx="3" fill="'+c
        +'" stroke="#fff" stroke-width="1.5"/><text x="'+d.x+'" y="'+(cy+4).toFixed(1)
        +'" font-size="9" font-weight="800" text-anchor="middle" fill="#fff">控</text>';
    }else{
      s+='<circle cx="'+d.x+'" cy="'+cy.toFixed(1)+'" r="'+(st==='a'?6.5:5)+'" fill="'+c
        +'" stroke="#fff" stroke-width="1.3"/>';
    }
    if(o.labels||st==='a'||o.alarmDev===d.id)
      s+='<text x="'+(d.x+11)+'" y="'+(cy+4).toFixed(1)+'" font-size="'+(st==='a'?11.5:10)
        +'" font-weight="'+(st==='a'?800:600)+'" fill="'
        +(st==='a'?c:'var(--el-text-color-secondary)')+'">'+d.id+'</text>';
  });
  return s;
};

/* ---------- 通用剧本播放器 CP.core.SIM：安防 / 消防 / 外协共用 ----------
   统一入口（剧本选择卡）、统一控制条、统一运动引擎（沿用 YMS 货车移动模式）、
   统一弹窗与矩阵通知动画。各域只提供 cfg = {ns, scn, stage, meta, layer} */
CP.core.SIM={P:{cfg:null,sc:-1,vm:0,mult:1,raf:null,t0:null,ix:-1,trail:{},ref:null,popShown:false}};
var SIM=CP.core.SIM;
SIM.SP=function(u){                        /* 与 YMS speedProfile 同一公式 */
  var a=.24,d=.26,v=1/(1-(a+d)/2);
  if(u<a)return v*u*u/(2*a);
  if(u>1-d)return 1-v*(1-u)*(1-u)/(2*d);
  return v*(a/2+(u-a));
};
SIM.interp=function(kf,vm){
  var sy=CP.core.map.sy,i=0;
  while(i<kf.length-2&&kf[i+1].t<=vm)i++;
  var A=kf[i],B=kf[i+1]||kf[i],span=B.t-A.t;
  var u=span>0?Math.min(1,Math.max(0,(vm-A.t)/span)):1;
  var same=(A.x===B.x&&A.y===B.y),f=same?1:SIM.SP(u);
  var x=A.x+(B.x-A.x)*f,y=sy(A.y)+(sy(B.y)-sy(A.y))*f;
  var dx=B.x-A.x,dy=sy(B.y)-sy(A.y);
  var ang=(!same&&(Math.abs(dx)>0.4||Math.abs(dy)>0.4))?Math.atan2(dy,dx)*180/Math.PI:null;
  var spd=same?0:Math.sqrt(dx*dx+(dy/CP.core.map.SY)*(dy/CP.core.map.SY))/(span*60);
  return {x:x,y:y,ang:ang,still:same,spd:spd*60,started:vm>=kf[0].t};
};

SIM.shapes.pulse=function(x,y,col,txt,r){
  var sy=CP.core.map.sy(y);
  return '<g transform="translate('+x+','+sy.toFixed(1)+')">'
   +'<circle r="'+(r||8)+'" fill="'+col+'" opacity=".32" class="cp-sec__pulse"/>'
   +'<circle r="'+((r||8)/2)+'" fill="'+col+'" stroke="#fff" stroke-width="1.3"/>'
   +(txt?'<text x="'+((r||8)+5)+'" y="3.6" font-size="10.5" font-weight="800" fill="'+col
     +'">'+txt+'</text>':'')+'</g>';
};
SIM.fov=function(cx,cy,tx,ty,half,col){
  var d=Math.sqrt((tx-cx)*(tx-cx)+(ty-cy)*(ty-cy));
  if(d<1)return '';
  var r=Math.min(220,d*1.22),a=Math.atan2(ty-cy,tx-cx),h=(half||26)*Math.PI/180;
  var x1=cx+r*Math.cos(a-h),y1=cy+r*Math.sin(a-h);
  var x2=cx+r*Math.cos(a+h),y2=cy+r*Math.sin(a+h);
  return '<path d="M'+cx+','+cy.toFixed(1)+' L'+x1.toFixed(1)+','+y1.toFixed(1)
   +' A'+r.toFixed(1)+','+r.toFixed(1)+' 0 0 1 '+x2.toFixed(1)+','+y2.toFixed(1)+' Z" '
   +'fill="'+(col||'#E2231A')+'" opacity=".15" stroke="'+(col||'#E2231A')
   +'" stroke-width="1" stroke-opacity=".45"/>';
};

/* ---------- 控制 ---------- */
SIM.stop=function(){
  var P=SIM.P;
  if(P.raf){cancelAnimationFrame(P.raf);P.raf=null}
  P.t0=null;
  var b=document.getElementById('cp-sim-play');if(b)b.textContent='▶ 播放';
};
SIM.play=function(){
  var P=SIM.P,S=P.cfg.scn[P.sc],G=P.cfg.stage[S.id];
  if(P.raf){SIM.stop();return}
  if(P.vm>=G.dur-0.01){P.vm=0;P.ix=-1;P.trail={}}
  document.getElementById('cp-sim-play').textContent='⏸ 暂停';P.t0=null;
  function fr(ts){
    if(P.t0===null)P.t0=ts;
    var dt=(ts-P.t0)/1000;P.t0=ts;
    P.vm+=dt*P.mult;                       /* 1 实秒 = 1 虚拟分钟（压缩 60×） */
    if(P.vm>=G.dur){P.vm=G.dur;SIM.tick();SIM.stop();return}
    SIM.tick();P.raf=requestAnimationFrame(fr);
  }
  P.raf=requestAnimationFrame(fr);
};
SIM.seek=function(vm){SIM.stop();SIM.P.vm=vm;SIM.P.trail={};SIM.P.ix=-1;SIM.tick()};
/* 步骤时间去重：同一 t 的相邻步骤会导致前一步永不成为「当前步」，此处按 0.35 分钟错开 */
SIM.normalize=function(cfg){
  cfg.scn.forEach(function(S){
    for(var i=1;i<S.steps.length;i++)
      if(S.steps[i].t<=S.steps[i-1].t)S.steps[i].t=+(S.steps[i-1].t+0.35).toFixed(2);
    var G=cfg.stage[S.id],last=S.steps[S.steps.length-1].t;
    if(G&&G.dur<last+1)G.dur=Math.ceil(last+1);
  });
  return cfg;
};
SIM.tick=function(){
  var P=SIM.P,R=P.ref;if(!R)return;
  var S=P.cfg.scn[P.sc],G=P.cfg.stage[S.id],vm=P.vm,sy=CP.core.map.sy,dyn='',hud='';
  G.mov.forEach(function(m,mi){
    var kf=m.kf||(G.kfOf?G.kfOf(S,m):[]),p=SIM.interp(kf,vm),n=R.mov[mi];
    n.wrap.setAttribute('transform','translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')');
    if(p.ang!==null){
      var df=((p.ang-(n.ang||0)+540)%360)-180;n.ang=(n.ang||0)+df;
      n.bd.setAttribute('transform','rotate('+n.ang.toFixed(1)+')');
    }
    n.wrap.style.opacity=p.started?((G.uav&&vm<3.4)?.35:1):0;
    if(G.uav&&!m.kf){
      var alt=G.alt(vm);n.bd.style.opacity=alt>0.5?1:.55;
      hud='<b>UAV-01</b>　'+(alt>0.5?'飞行中':(vm<3.4?'待飞':'已降落'))
       +'<br>ALT <span class="wp">'+alt.toFixed(0)+' m</span>'+(alt>0&&alt<20?'（抵近）':'')
       +'<br>SPD '+Math.min(15,p.spd*60).toFixed(1)+' m/s'
       +'<br>BAT '+(vm<2?96:Math.max(38,96-58*(vm-2)/26)).toFixed(0)+' %';
    }
    if(p.started&&!p.still){
      var K=m.id;P.trail[K]=P.trail[K]||[];
      var L=P.trail[K][P.trail[K].length-1];
      if(!L||Math.abs(p.x-L[0])>3||Math.abs(p.y-L[1])>3)P.trail[K].push([p.x,p.y]);
    }
    if(P.trail[m.id]&&P.trail[m.id].length>1){
      var pts=P.trail[m.id].map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ');
      R.tr[mi].u.setAttribute('points',pts);R.tr[mi].l.setAttribute('points',pts);
    }
    m._p=p;
  });
  (G.cams||[]).forEach(function(c){
    if(vm>=c.from&&vm<=c.to){
      var t=G.mov[c.at||0]._p;
      dyn+=SIM.fov(c.x,sy(c.y),t.x,t.y,26,c.col)
       +SIM.shapes.pulse(c.x,c.y,c.col||'#E2231A',c.id,7);
    }
  });
  if(G.extra)dyn+=G.extra(vm);
  R.dyn.innerHTML=dyn;
  R.hud.style.display=hud?'block':'none';
  if(hud)R.hud.innerHTML=hud+'<br>T+'+vm.toFixed(1)+' min';
  R.clock.textContent='T+'+vm.toFixed(1)+' min';
  var ix=0;for(var i=0;i<S.steps.length;i++)if(S.steps[i].t<=vm+0.001)ix=i;
  R.fill.style.width=(Math.min(1,vm/G.dur)*100).toFixed(1)+'%';
  if(ix!==P.ix){P.ix=ix;SIM.paint(S,G,ix);}
};
SIM.paint=function(S,G,ix){
  var R=SIM.P.ref,sp=S.steps[ix];if(!R)return;
  R.nar.innerHTML=SIM.narHTML(sp,ix);
  R.nodes.forEach(function(n,i){
    n.className='nd'+(i<ix?' dn':'')+(i===ix?' cu':'')+(S.steps[i].lv&&i<=ix?' l1':'')});
  R.cnt.textContent=(ix+1);
  /* 现场视窗：按步骤 sc 切换画面，与剧本同步 */
  if(R.stage){
    var kind=sp.sc||G.stageDefault||G.popKind;
    R.stage.innerHTML=SIM.scene(kind);
    R.cap.innerHTML='<b>'+(sp.cap||sp.ti)+'</b>'
     +'<span>'+(sp.capSub||(G.mapTitle||''))+'</span>'
     +(sp.lv?'<span class="tg">'+sp.lv+'</span>':'');
  }
  R.disp.innerHTML=S.steps.map(function(x,i){
    return '<li class="'+(i<=ix?'dn':'')+'"><b>'+x.c+'</b>'+x.ti
     +(x.lv?' <span class="cp-tag '+(x.lv==='L1'?'r':'o')+'" style="transform:scale(.85)">'
     +x.lv+'</span>':'')+'</li>'}).join('');
  var E=G.evt;
  R.evt.innerHTML=(ix<E.from)?'<div class="cp-note">当前步骤尚未产生告警事件。</div>'
   :'<div class="cp-sec__evt on"><b>'+E.n+'</b> <span class="cp-tag '+(ix>=E.close?'g':'r')+'">'
     +(ix>=E.close?'已闭环':'处置中')+'</span><div class="m">'+E.id+'<br>'+E.loc+'</div>'
     +'<div style="margin-top:7px"><span class="cp-btn sm" id="cp-sim-repop">▶ '
     +(G.popBtn||'视频复核')+'</span></div></div>';
  var rp=document.getElementById('cp-sim-repop');
  if(rp)rp.onclick=function(){SIM.pop(G)};
  var NT=(typeof G.ntf==='function')?G.ntf():G.ntf;
  R.ntf.innerHTML=(ix<G.ntfAt)?'<div class="cp-note">尚未触发通知分发。</div>'
   :NT.map(function(x,i){
      return '<div class="cp-sec__ntf" style="animation-delay:'+(i*.16).toFixed(2)+'s">'
       +'<div><b>'+x[0]+'</b><br><span>'+x[1]+'</span></div>'
       +'<span class="cp-tag g">'+x[2]+'</span></div>'}).join('');
  if(G.kpi)R.kpi.innerHTML=G.kpi(ix);
  if(ix>=G.popAt&&!SIM.P.popShown){SIM.P.popShown=true;SIM.pop(G)}
};

/* 手动步骤拦截：到达 manual 步且未操作则暂停 */
SIM.blocked=function(){
  var P=SIM.P,S=P.cfg.scn[P.sc],G=P.cfg.stage[S.id];
  if(!G.manual)return false;
  P.manualDone=P.manualDone||{};
  return P.ix===G.manual.at&&!P.manualDone[G.manual.at];
};
SIM.playDoc=function(){
  var P=SIM.P,S=P.cfg.scn[P.sc],G=P.cfg.stage[S.id];
  if(P.raf){SIM.stop();return}
  if(P.vm>=G.dur-0.01){P.vm=0;P.ix=-1;P.manualDone={}}
  document.getElementById('cp-sim-play').textContent='⏸ 暂停';P.t0=null;
  function fr(ts){
    if(P.t0===null)P.t0=ts;
    var dt=(ts-P.t0)/1000;P.t0=ts;
    if(SIM.blocked()){SIM.stop();CP.SYS.toast('请在单据上完成手动操作后继续');return}
    P.vm+=dt*P.mult*(G.speed||1);
    if(P.vm>=G.dur){P.vm=G.dur;SIM.tickDoc();SIM.stop();return}
    SIM.tickDoc();P.raf=requestAnimationFrame(fr);
  }
  P.raf=requestAnimationFrame(fr);
};
SIM.seekDoc=function(vm){SIM.stop();SIM.P.vm=vm;SIM.P.ix=-1;SIM.tickDoc()};
SIM.tickDoc=function(){
  var P=SIM.P,R=P.ref;if(!R)return;
  var S=P.cfg.scn[P.sc],G=P.cfg.stage[S.id],vm=P.vm;
  var ix=0;for(var i=0;i<S.steps.length;i++)if(S.steps[i].t<=vm+0.001)ix=i;
  R.fill.style.width=(Math.min(1,vm/G.dur)*100).toFixed(1)+'%';
  R.clock.textContent=S.steps[ix].c;
  if(ix!==P.ix){P.ix=ix;SIM.paintDoc(S,G,ix);}
};
SIM.paintDoc=function(S,G,ix){
  var R=SIM.P.ref,D=G.doc,sp=S.steps[ix];if(!R)return;
  R.nar.innerHTML=SIM.narHTML(sp,ix);
  R.nodes.forEach(function(n,i){
    n.className='nd'+(i<ix?' dn':'')+(i===ix?' cu':'')+(S.steps[i].lv&&i<=ix?' l1':'')});
  R.cnt.textContent=(ix+1);
  R.disp.innerHTML=S.steps.map(function(x,i){
    return '<li class="'+(i<=ix?'dn':'')+'"><b>'+x.c+'</b>'+x.ti+'</li>'}).join('');
  /* 审批链 + SLA */
  R.chain.innerHTML=D.chain.map(function(c,i){
    var st=(ix>=c.done)?'ok':((ix>=c.at)?'cur':'wait');
    return (i?'<span class="cp-arw">→</span>':'')
     +'<div class="cp-chain__n '+st+'"><b>'+c.n+'</b><span>'+c.r+'</span>'
     +'<i>'+(st==='ok'?'✔ 已完成':(st==='cur'?('⏱ '+c.sla):c.sla))+'</i></div>'}).join('');
  /* 活体单据 */
  R.badge.innerHTML='<span class="cp-tag '+D.status(ix)[1]+'">'+D.status(ix)[0]+'</span>';
  R.doc.innerHTML=D.fields.map(function(f){
    var on=ix>=f.at,val=(typeof f.v==='function')?f.v(ix):f.v;
    return '<div class="cp-doc__f'+(on?' on':'')+(ix===f.at?' just':'')+'">'
     +'<label>'+f.k+(f.req?' <i>*</i>':'')+'</label>'
     +'<div class="vv">'+(on?val:'<span class="ph">待填写</span>')
     +(on&&f.req?' <b class="ok">✓</b>':'')+'</div></div>'}).join('')
   +'<div class="cp-doc__sign">'+D.stamps.map(function(t){
     var on=ix>=t.at;
     return '<div class="cp-doc__st'+(on?' on':'')+'"><span>'+t.lane+'</span>'
      +'<b>'+(on?t.txt:'待签批')+'</b>'+(on?'<em>'+t.who+'</em>':'')+'</div>'}).join('')
   +'</div>';
  /* 手动操作按钮 */
  R.act.innerHTML='';
  if(G.manual&&ix===G.manual.at){
    SIM.P.manualDone=SIM.P.manualDone||{};
    if(!SIM.P.manualDone[ix]){
      R.act.innerHTML='<span class="cp-btn" id="cp-doc-manual">'+G.manual.label+'</span>'

       +G.manual.hint+'</span>';

  }
  /* 规则芯片 */
  var CH=D.chips.filter(function(c){return ix>=c.at});

    return '<div class="cp-chip '+(c.k||'ok')+'" style="animation-delay:'+(i*.1).toFixed(2)+'s">'

     +'<span class="cp-tag g">'+x[2]+'</span></div>'}).join('')
   :'<div class="cp-note">尚未触发系统联动。</div>';
  /* 逐行试算表 */
  if(R.calc&&D.calc)R.calc.innerHTML='<div class="t3">费用逐行试算（扣款项按规则逐条出现）</div>'
   +D.calc(ix);
  /* 房态微缩图 */
  if(R.grid&&D.grid)R.grid.innerHTML=D.grid(ix);
  /* 员工端 */
  if(R.phone&&D.phone)R.phone.innerHTML=D.phone(ix);
  /* 弹窗 */
  if(G.popAt!==undefined&&ix>=G.popAt&&!SIM.P.popShown){SIM.P.popShown=true;SIM.pop(G)}
};

/* ---------- 播放器 ---------- */
SIM.render=function(v,cfg){
  SIM.P.cfg=cfg;
  var bar=document.getElementById('cp-sim-bar');
  if(SIM.P.sc<0){if(bar)bar.classList.remove('show');return SIM.renderMenu(v,cfg)}
  if(cfg.kind==='doc')return SIM.renderDoc(v,cfg);
  var P=SIM.P,S=cfg.scn[P.sc],G=cfg.stage[S.id],sy=CP.core.map.sy;
  var lay=(G.base?G.base():'');
  G.mov.forEach(function(m,i){
    lay+='<polyline id="cp-sim-tru'+i+'" points="" fill="none" stroke="#04101E" '
     +'stroke-width="6" stroke-opacity=".5" stroke-linecap="round" stroke-linejoin="round"/>'
     +'<polyline id="cp-sim-trl'+i+'" points="" fill="none" stroke="'
     +(m.c||'#22C4A4')+'" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  lay+='<g id="cp-sim-dyn"></g>';
  G.mov.forEach(function(m,i){
    lay+='<g id="cp-sim-mov'+i+'" style="opacity:0"><g id="cp-sim-movb'+i+'">'
     +SIM.shapes[m.sh](m.c)+'</g>'
     +(m.lbl?'<text x="12" y="4" font-size="10.5" font-weight="800" fill="'
       +(m.c||'#7B6BD6')+'" paint-order="stroke" stroke="#0B1B30" stroke-width="3">'
       +m.id+'</text>':'')+'</g>';
  });
  v.innerHTML='<div class="cp-kpirow" id="cp-sim-kpi"></div>'
   +'<div class="cp-grid31">'
   +'<div class="cp-card"><h4>'+G.mapTitle
   +'<span class="hint">移动体连续插值 · 航迹尾迹 · 视锥实时指向</span></h4><div class="bd">'
   +'<div class="cp-legend">'+G.mov.map(function(m){
     return '<span><i style="background:'+(m.c||'#7B6BD6')+'"></i>'+m.id+'</span>'}).join('')
   +(G.legend||'')+'</div>'
   +'<div class="cp-map">'+CP.core.map.svg({layers:{plan:false,redx:false,blue:false,wb:false,pts:false},
      hlBld:G.hlBld,extra:(cfg.layer?cfg.layer(G):'')+lay})
   +'<div class="cp-uav__hud" id="cp-sim-hud" style="display:none"></div></div></div></div>'
   +'<div>'
   +'<div class="cp-card"><h4>现场视窗<span class="hint" id="cp-stage-tip">随剧本步骤同步切换</span></h4>'
   +'<div class="bd"><div class="cp-stage"><div class="cp-stage__cap" id="cp-stage-cap"></div>'
   +'<div id="cp-stage-sc"></div></div></div></div>'
   +'<div class="cp-card"><h4>关联事件</h4><div class="bd" id="cp-sim-evt"></div></div>'
   +'<div class="cp-card"><h4>'+(G.ntfTitle||'矩阵式通知分发')+'</h4>'
   +'<div class="bd" id="cp-sim-ntf"></div></div>'
   +'<div class="cp-card"><h4>处置闭环</h4><div class="bd">'
   +'<ul class="cp-sec__disp" id="cp-sim-disp"></ul></div></div>'
   +'</div></div>'
   +'<div class="cp-modal" id="cp-sim-modal"></div>';
  var q=function(i){return document.getElementById(i)};
  var br=SIM.bar(S,G,function(n){
    SIM.P.popShown=(+n.dataset.t)>=S.steps[G.popAt].t;SIM.seek(+n.dataset.t)});
  P.ref={dyn:q('cp-sim-dyn'),hud:q('cp-sim-hud'),nar:br.nar,fill:br.fill,
    evt:q('cp-sim-evt'),ntf:q('cp-sim-ntf'),disp:q('cp-sim-disp'),cnt:br.cnt,
    clock:br.clock,kpi:q('cp-sim-kpi'),stage:q('cp-stage-sc'),cap:q('cp-stage-cap'),
    mov:G.mov.map(function(m,i){return {wrap:q('cp-sim-mov'+i),bd:q('cp-sim-movb'+i),ang:0}}),
    tr:G.mov.map(function(m,i){return {u:q('cp-sim-tru'+i),l:q('cp-sim-trl'+i)}}),
    nodes:br.nodes};
  P.ix=-1;SIM.tick();
  q('cp-sim-play').onclick=function(){SIM.play()};
  q('cp-sim-reset').onclick=function(){SIM.P.popShown=false;SIM.seek(0)};
  q('cp-sim-prev').onclick=function(){SIM.seek(S.steps[Math.max(0,SIM.P.ix-1)].t)};
  q('cp-sim-next').onclick=function(){SIM.seek(S.steps[Math.min(S.steps.length-1,SIM.P.ix+1)].t)};
};

   +(sel.n==='矩阵通知'?'<div class="cp-fld"><label>通知对象</label>'

    });

  };
  draw();

  var cv=document.getElementById('cp-sys-canvas');

  cv.ondragover=function(e){e.preventDefault();cv.classList.add('over')};
  cv.ondragleave=function(){cv.classList.remove('over')};
  cv.ondrop=function(e){
    e.preventDefault();cv.classList.remove('over');

    var id='n'+(R.seq++);
    R.nodes.push({id:id,k:e.dataTransfer.getData('k'),n:e.dataTransfer.getData('n'),
      x:Math.max(8,Math.min(r.width-160,e.clientX-r.left-75)),
      y:Math.max(8,Math.min(r.height-60,e.clientY-r.top-26)),p:'待配置'});

      var sx=e.clientX,sy0=e.clientY,ox=nd.x,oy=nd.y,moved=false;
      var mv=function(ev){

        n.style.left=nd.x+'px';n.style.top=nd.y+'px';draw()};
      var up=function(){document.removeEventListener('mousemove',mv);
        document.removeEventListener('mouseup',up);if(moved)n.onclick=null};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    };
  });

    if(lv)CP.core.cfg.algo.level=lv.value;
    var nt=v.querySelectorAll('.cp-sys-nt');

      var arr=[];
      nt.forEach(function(c){if(c.checked)arr.push([c.dataset.n,c.dataset.c,'12s 送达'])});
      CP.core.cfg.notify=arr.length?arr:CP.core.cfg.notify;
    }

      +' 路 · 判级 '+CP.core.cfg.algo.level+' · 阈值 '+CP.core.cfg.algo.conf);
    CP.core.render();
  };
};

      f.onclick=function(){F.form.splice(+f.dataset.i,1);CP.SYS.toast('已移除字段');CP.core.render()}});
    q('cp-sys-fmsave').onclick=function(){CP.SYS.toast('表单已发布，入住申请页将使用新表单')};

  r.push(['门岗 7 个且与 YMS 同名同位',CP.core.map.GATES.length===7
