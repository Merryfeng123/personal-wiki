    CP.core.map.GATES.map(function(g){return g.n}).join('/')]);
  r.push(['底图图层齐备（道路19/月台5组/卸货口21/蓝口6/规划线13/地磅3）',
    CP.core.map.ROADS.length===19&&CP.core.map.DGROUPS.length===5
    &&CP.core.map.REDX.length===21&&CP.core.map.BLUE.length===6
    &&CP.core.map.PLAN.length===13&&CP.core.map.WB.length===3,'ok']);
  r.push(['源坐标空间 1265×1243 · viewBox 高 845',
    CP.core.map.H===1243&&CP.core.map.VB_H===845,
    CP.core.map.W+'×'+CP.core.map.H+' → '+CP.core.map.VB_H]);
  var mf=CP.core.map.BLD.filter(function(b){return /^MF[1-8]$/.test(b.n)});
  r.push(['宿舍 MF1–MF8 八栋齐备',mf.length===8,
    mf.map(function(b){return b.n}).sort().join(',')]);
  r.push(['SY 未被修改 = 0.68',CP.core.map.SY===0.68,String(CP.core.map.SY)]);
  var ok=true,ids={};
  CP.SEC.data.SCN.forEach(function(s){if(ids[s.id])ok=false;ids[s.id]=1;
    s.steps.forEach(function(x){if(!x.c||!x.ti||!x.nar)ok=false})});
  r.push(['A6 剧本步骤完整且 ID 唯一',ok,CP.SEC.data.SCN.length+' 条剧本']);
  r.push(['A7 每条剧本含关键分级节点',
    CP.SEC.data.SCN.every(function(s){return s.steps.some(function(x){return !!x.lv})}),'ok']);
  r.push(['消防剧本步骤完整',CP.FIRE.data.SCN[0].steps.every(function(x){
    return x.c&&x.ti&&x.nar&&x.mt}),CP.FIRE.data.SCN[0].steps.length+' 步']);
  r.push(['消防点位状态码合法',CP.FIRE.data.DEV.every(function(d){
    return !!CP.FIRE.STC[d.st]}),CP.FIRE.data.DEV.length+' 个点位']);
  r.push(['外协剧本步骤完整',CP.OSC.data.SCN[0].steps.every(function(x){
    return x.c&&x.ti&&x.nar&&x.mt}),CP.OSC.data.SCN[0].steps.length+' 步']);
  r.push(['宿舍 8 栋结构与 PDF 一致',CP.DOM.data.BLD.length===8
    &&CP.DOM.data.BLD.reduce(function(a,b){return a+b.cam},0)===881,
    '合计 '+CP.DOM.data.BLD.reduce(function(a,b){return a+b.cam},0)+' 台']);
  r.push(['MF1–MF4 跳 14 层',CP.DOM.floors(CP.DOM.data.BLD[0]).indexOf('14F')<0
    &&CP.DOM.floors(CP.DOM.data.BLD[0]).indexOf('15F')>=0,
    CP.DOM.floors(CP.DOM.data.BLD[0]).slice(0,15).join(',')]);
  r.push(['园区切换器 12 园区且仅产业园可选',
    CP.core.PARKS.length===12&&CP.core.PARKS.filter(function(p){return p[2]}).length===1,
    CP.core.PARKS.filter(function(p){return p[2]})[0][1]]);
  var G3=CP.SEC.stage['SC-SEC-03'],K=G3.kfOf(CP.SEC.data.SCN[2]);
  r.push(['无人机关键帧单调递增',K.every(function(k,i){return i===0||k.t>=K[i-1].t}),
    K.length+' 个关键帧']);
  var hov=K.filter(function(k,i){return i>0&&K[i-1].x===k.x&&K[i-1].y===k.y&&k.t>K[i-1].t});
  r.push(['含悬停段（同坐标连续关键帧）',hov.length>0,hov.length+' 段悬停']);
  r.push(['无人机高度：起飞 0m / 抵近 15m / 降落 0m',
    G3.alt(0)===0&&Math.round(G3.alt(13))===15&&G3.alt(37)===0,
    '0m / '+G3.alt(13).toFixed(0)+'m / '+G3.alt(37).toFixed(0)+'m']);
  var yms=document.getElementById('cp-log-yms-src');
  r.push(['YMS 原件已内嵌',!!yms&&yms.textContent.length>100000,
    yms?(yms.textContent.length+' 字符'):'缺失']);
  var names={};
  for(var mk in CP.core.MENU)CP.core.MENU[mk].groups.forEach(function(g){
    g[1].forEach(function(it){names[it[0]]=1})});
  var orphan=[];
  ['FIRE','SEC','OSC'].forEach(function(ns){
    if(!CP[ns].views)return;
    Object.keys(CP[ns].views).forEach(function(k){if(!names[k])orphan.push(ns+'/'+k)})});
  r.push(['无孤立视图（视图 key 均在菜单中）',orphan.length===0,orphan.join(', ')||'ok']);
  var cfg6=['物联网平台','数据集成平台','规则联动引擎','视频与流媒体服务',
    'AI 算法调度编排','业务流程扩展使能'];
  r.push(['平台配置台 6 项能力齐备',cfg6.every(function(k){return !!CP.SYS.views[k]}),
    cfg6.length+' 项 · 系统管理共 '+Object.keys(CP.SYS.views).length+' 视图']);
  var rpt7=['园区运营总览','安防态势一张图','通行记录分析','设施健康度看板','能耗报表',
    '看板设置','移动端报表'];
  r.push(['运营报表 7 视图齐备',rpt7.every(function(k){return !!CP.RPT.views[k]}),
    Object.keys(CP.RPT.views).length+' 个视图']);
  r.push(['底部播放条容器存在',!!document.getElementById('cp-sim-bar'),'cp-sim-bar']);
  var scOK=true,scN=0;
  [CP.SEC.simCfg,CP.FIRE.simCfg].forEach(function(c){c.scn.forEach(function(S){
    S.steps.forEach(function(x){scN++;if(!x.sc)scOK=false})})});
  r.push(['地图剧本每步均配现场画面',scOK,scN+' 步']);
  r.push(['三域均接入通用播放器',!!(CP.SEC.simCfg&&CP.FIRE.simCfg&&CP.OSC.simCfg)
    &&[CP.SEC.simCfg,CP.FIRE.simCfg,CP.OSC.simCfg].every(function(c){
      return c.scn.length&&c.stage&&c.meta&&c.note}),'SEC/FIRE/OSC']);
  var mv=0,okm=true;
  [CP.SEC.simCfg,CP.FIRE.simCfg].forEach(function(c){        /* 地图类剧本 */
    c.scn.forEach(function(sc){var G=c.stage[sc.id];
      if(!G||G.popAt===undefined||!G.evt||!G.mov.length){okm=false;return}
      G.mov.forEach(function(m){mv++;
        var kf=m.kf||(G.kfOf?G.kfOf(sc,m):[]);
        if(!kf.length)okm=false;
        var p=CP.core.SIM.interp(kf,G.dur);
        if(isNaN(p.x)||isNaN(p.y))okm=false;
      })})});
  r.push(['地图类剧本移动体/弹窗/事件齐备',okm,mv+' 个移动体（安防 3 + 消防 1 条）']);
  var mono=[CP.SEC.simCfg,CP.FIRE.simCfg,CP.OSC.simCfg,CP.DOM.simCfg].every(function(c){
    return c.scn.every(function(S){return S.steps.every(function(x,i){
      return i===0||x.t>S.steps[i-1].t})})});
  var nsc=[CP.SEC.simCfg,CP.FIRE.simCfg,CP.OSC.simCfg,CP.DOM.simCfg]
    .reduce(function(a,c){return a+c.scn.length},0);
  r.push(['所有剧本步骤时间严格递增（每步可达）',mono,nsc+' 条剧本']);
  var docOK=true,docN=0;
  [CP.DOM.simCfg,CP.OSC.simCfg].forEach(function(c){
    c.scn.forEach(function(S){
      var G=c.stage[S.id],n=S.steps.length;docN++;
      if(!G||G.kind!=='doc'||!G.doc){docOK=false;return}
      var D=G.doc;
      if(!(D.fields.length>=13&&D.stamps.length>=4&&D.chips.length>=8&&D.ntf.length>=4))docOK=false;
      if(!D.fields.concat(D.stamps).concat(D.chips).every(function(x){return x.at>=0&&x.at<n}))docOK=false;
      if(!D.ntf.every(function(x){return x[3]>=0&&x[3]<n}))docOK=false;
      if(!G.manual||G.manual.at<0||G.manual.at>=n)docOK=false;
      if(G.popAt<0||G.popAt>=n)docOK=false;
    })});
  r.push(['六条单据剧本要素与步序合法',docOK,docN+' 条（宿舍 3 + 外协 3）']);
  r.push(['宿舍与外协均为单据形态（无地图动画）',
    CP.DOM.simCfg.kind==='doc'&&CP.OSC.simCfg.kind==='doc'
    &&CP.DOM.simCfg.scn.every(function(S){return !CP.DOM.stage[S.id].mov.length})
    &&CP.OSC.simCfg.scn.every(function(S){return !CP.OSC.stage[S.id].mov.length}),'ok']);
  r.push(['配置台与剧本联通（cfg 载体）',
    !!(CP.core.cfg&&CP.core.cfg.notify.length&&CP.core.cfg.algo.type),
    '通知 '+CP.core.cfg.notify.length+' 路 · '+CP.core.cfg.algo.type]);
  var vis='';
  [].forEach.call(document.body.querySelectorAll('*'),function(e){
    if(e.tagName==='SCRIPT'||e.tagName==='STYLE')return;
    [].forEach.call(e.childNodes,function(x){if(x.nodeType===3)vis+=x.nodeValue})});
  var hit=['\u6d4e\u5357\u4e1c\u660e','\u5927\u5b97\u80fd\u6e90']
    .filter(function(w){return vis.indexOf(w)>=0});
  r.push(['品牌合规：不出现其他案例名',hit.length===0,hit.join(',')||'ok']);
  var rows=r.map(function(x){return{检查项:x[0],通过:x[1]?'✔':'✘',详情:x[2]}});
  if(console&&typeof console.table==='function'){try{console.table(rows)}catch(e){CP.core.dump(r)}}
  else CP.core.dump(r);
  return r;
};
CP.core.dump=function(r){
  var bad=r.filter(function(x){return !x[1]});
  console.log('自检 '+(r.length-bad.length)+'/'+r.length+' 通过'
    +(bad.length?'；未通过 '+bad.length+' 项':'')); 
  bad.forEach(function(x){console.log('  ✘ '+x[0]+' —— '+x[2])});
};
console.log('合肥阳光电源产业园区 · 智慧园区运营平台 POC');
CP.core.check();
/* ==== CP.CORE.BOOT END ==== */
