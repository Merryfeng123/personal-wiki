<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合肥阳光电源产业园区 · 智慧园区运营平台 POC v0.3</title>
<style>
/* ==== CP.CORE TOKENS BEGIN ==== */
:root,[data-theme="light"]{
  --el-color-primary:#0975E5;
  --el-color-primary-light-3:#3B91EB;--el-color-primary-light-5:#6DACF1;
  --el-color-primary-light-7:#9FC8F6;--el-color-primary-light-8:#B8D6F8;
  --el-color-primary-light-9:#E7F1FC;--el-color-primary-dark-2:#0760BA;
  --el-color-success:#52C41A;--cp-success-bg:#F6FFED;--cp-success-border:#B7EB8F;
  --el-color-warning:#FAAD14;--cp-warning-bg:#FFFBE6;--cp-warning-border:#FFE58F;
  --el-color-danger:#FF4D4F;--cp-danger-bg:#FFF1F0;--cp-danger-border:#FFCCC7;
  --el-color-info:#8C8C8C;
  --el-bg-color:#FFFFFF;--el-bg-color-page:#F0F2F5;--el-bg-color-overlay:#FFFFFF;
  --el-fill-color-light:#FAFAFA;--cp-table-header:#F2F4FA;
  --cp-panel-bg:#F6F9FE;--cp-panel-grid:#E9F4FF;
  --el-text-color-primary:#333333;--el-text-color-regular:#595959;
  --el-text-color-secondary:#8C8C8C;--el-text-color-placeholder:#BFBFBF;
  --el-border-color:#E9EBEF;--el-border-color-light:#F1F3F5;--el-border-color-lighter:#F5F6F8;
  --el-border-radius-base:4px;--el-border-radius-small:2px;
  --cp-topbar-bg:#FFFFFF;--cp-side-bg:#FFFFFF;
  --cp-bld-plant:#E3EAF3;--cp-bld-aux:#EDF1F6;--cp-bld-aux2:#F0F3F7;
  --cp-bld-yard:#E6EEF4;--cp-bld-rsv:#F4F6F9;
  --cp-bld-stk:#B6C4D6;--cp-bld-text:#4A5A6E;--cp-road:#FFFFFF;--cp-road-text:#9AA9BC;
}
[data-theme="dark"],[data-theme="screen"]{
  --navy:#142642;--navy2:#1E3559;--navy3:#24406B;--navy4:#0E1C33;--navy5:#0A1526;
  --line:#33507A;--ice:#DCE9F7;--mute:#9DB2CC;--white:#F7FAFF;
  --red:#E2231A;--teal:#1AA085;--teal2:#22C4A4;--gold:#E8A33D;--violet:#7B6BD6;--blue:#3E8FD4;
  --el-color-primary:#3E8FD4;
  --el-color-primary-light-3:#2F6FA8;--el-color-primary-light-5:#255A8A;
  --el-color-primary-light-7:#1D466C;--el-color-primary-light-8:#193C5D;
  --el-color-primary-light-9:#16334E;--el-color-primary-dark-2:#63A8E0;
  --el-color-success:#22C4A4;--cp-success-bg:#123A33;--cp-success-border:#1AA085;
  --el-color-warning:#E8A33D;--cp-warning-bg:#3A2E17;--cp-warning-border:#B07C28;
  --el-color-danger:#E2231A;--cp-danger-bg:#3A1512;--cp-danger-border:#9E1912;
  --el-color-info:#9DB2CC;
  --el-bg-color:#1E3559;--el-bg-color-page:#142642;--el-bg-color-overlay:#24406B;
  --el-fill-color-light:#24406B;--cp-table-header:#24406B;
  --cp-panel-bg:#0E1C33;--cp-panel-grid:#1E3559;
  --el-text-color-primary:#F7FAFF;--el-text-color-regular:#DCE9F7;
  --el-text-color-secondary:#9DB2CC;--el-text-color-placeholder:#6B819C;
  --el-border-color:#33507A;--el-border-color-light:#24406B;--el-border-color-lighter:#1E3559;
  --cp-topbar-bg:#0E1C33;--cp-side-bg:#0E1C33;
  --cp-bld-plant:#1C3E6B;--cp-bld-aux:#16294A;--cp-bld-aux2:#152540;
  --cp-bld-yard:#1B3A54;--cp-bld-rsv:#0F1D31;
  --cp-bld-stk:#82AAD8;--cp-bld-text:#FFFFFF;--cp-road:#0A1526;--cp-road-text:#E6F0FA;
}
/* ==== CP.CORE TOKENS END ==== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",-apple-system,sans-serif;
  font-size:14px;background:var(--el-bg-color-page);color:var(--el-text-color-primary);
  display:flex;flex-direction:column;overflow:hidden;transition:background .16s,color .16s}
#cp-core-topbar{height:42px;flex:0 0 42px;display:flex;align-items:stretch;
  background:var(--cp-topbar-bg);border-bottom:1px solid var(--el-border-color);
  position:relative;z-index:30}
.cp-core__brand{display:flex;align-items:center;padding:0 22px 0 16px;font-size:15px;
  font-weight:700;color:var(--el-color-primary);white-space:nowrap}
.cp-core__nav{display:flex;align-items:stretch;flex:1 1 auto;min-width:0;overflow:hidden}
.cp-core__nav a{display:flex;align-items:center;padding:0 14px;font-size:14px;cursor:pointer;
  color:var(--el-text-color-primary);white-space:nowrap;transition:color .14s}
.cp-core__nav a:hover,.cp-core__nav a.on{color:var(--el-color-primary)}
.cp-core__tools{display:flex;align-items:center;gap:8px;padding-right:14px}
.cp-core__tools .th{font-size:12px;cursor:pointer;color:var(--el-text-color-secondary);
  border:1px solid var(--el-border-color);border-radius:4px;padding:2px 8px;user-select:none}
.cp-core__tools .th:hover{color:var(--el-color-primary);border-color:var(--el-color-primary)}
.cp-core__avatar{width:26px;height:26px;border-radius:50%;
  background:linear-gradient(140deg,#8FB6E8,#4C7DB5)}
.cp-core__tools b{font-size:13px;font-weight:400;color:var(--el-text-color-regular)}
#cp-core-body{flex:1 1 auto;display:flex;min-height:0}
#cp-core-side{flex:0 0 196px;background:var(--cp-side-bg);
  border-right:1px solid var(--el-border-color);overflow-y:auto;padding:8px 0}
#cp-core-side.hide{flex-basis:0;border-right:none;overflow:hidden}
.cp-grp>b{display:flex;align-items:center;padding:10px 13px;font-size:13.5px;font-weight:400;
  color:var(--el-text-color-primary);cursor:pointer;user-select:none}
.cp-grp>b:hover{color:var(--el-color-primary)}
.cp-grp>b .ar{margin-left:auto;font-size:11px;color:var(--el-text-color-placeholder);
  transition:transform .16s}
.cp-grp.open>b .ar{transform:rotate(180deg)}
.cp-grp ul{display:none;list-style:none;padding-bottom:5px}
.cp-grp.open ul{display:block}
.cp-grp li{padding:7px 13px 7px 25px;font-size:13px;color:var(--el-text-color-regular);
  cursor:pointer;display:flex;align-items:center;gap:5px;line-height:1.45}
.cp-grp li:hover,.cp-grp li.on{color:var(--el-color-primary)}
.cp-dot{width:5px;height:5px;border-radius:50%;flex:0 0 5px;margin-left:auto}
.cp-dot.f{background:var(--el-color-primary)}
.cp-dot.e{background:transparent;border:1px solid var(--el-text-color-placeholder)}
#cp-core-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;position:relative}
#cp-core-crumb{flex:0 0 auto;padding:9px 16px;font-size:12.5px;
  color:var(--el-text-color-secondary);display:flex;align-items:center;gap:6px}
#cp-core-crumb b{color:var(--el-text-color-primary);font-weight:700}
#cp-core-crumb .tog{margin-left:auto;cursor:pointer;font-size:12px}
#cp-core-crumb .tog:hover{color:var(--el-color-primary)}
#cp-core-view{flex:1 1 auto;min-height:0;overflow:auto;padding:0 16px 16px}
#cp-core-view.bare{padding:0;overflow:hidden}
.cp-kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.cp-kpi{background:var(--el-bg-color);border:1px solid var(--el-border-color-light);
  border-radius:4px;padding:12px 15px}
.cp-kpi label{display:block;font-size:12.5px;color:var(--el-text-color-secondary);margin-bottom:5px}
.cp-kpi .v{font-size:25px;font-weight:700;line-height:1.1;color:var(--el-color-primary)}
.cp-kpi .v.g{color:var(--el-color-success)}.cp-kpi .v.o{color:var(--el-color-warning)}
.cp-kpi .v.r{color:var(--el-color-danger)}.cp-kpi .v.n{color:var(--el-text-color-primary)}
.cp-kpi .u{font-size:12.5px;font-weight:400;color:var(--el-text-color-secondary);margin-left:3px}
.cp-kpi .sub{font-size:11.5px;color:var(--el-text-color-placeholder);margin-top:3px}
.cp-card{background:var(--el-bg-color);border:1px solid var(--el-border-color-light);
  border-radius:4px;margin-bottom:12px}
.cp-card>h4{display:flex;align-items:center;padding:12px 15px 0;font-size:14.5px;font-weight:700}
.cp-card>h4 .hint{margin-left:auto;font-size:12px;font-weight:400;color:var(--el-text-color-secondary)}
.cp-card>h4 .ex{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--el-color-primary);cursor:pointer}
.cp-card>.bd{padding:13px 15px 15px}
.cp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cp-grid31{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.cp-grid13{display:grid;grid-template-columns:1fr 2fr;gap:12px}
@media(max-width:1240px){.cp-grid2,.cp-grid31,.cp-grid13{grid-template-columns:1fr}}
table.cp-tb{width:100%;border-collapse:collapse;font-size:13px}
table.cp-tb th{background:var(--cp-table-header);color:var(--el-text-color-regular);
  font-weight:600;text-align:left;padding:9px 11px;white-space:nowrap}
table.cp-tb td{padding:10px 11px;border-bottom:1px solid var(--el-border-color-lighter);
  color:var(--el-text-color-regular)}
table.cp-tb tr:hover td{background:var(--el-fill-color-light)}
table.cp-tb a{color:var(--el-color-primary);cursor:pointer}
.cp-tag{display:inline-block;padding:1px 8px;border-radius:2px;font-size:12px;
  line-height:19px;border:1px solid;white-space:nowrap}
.cp-tag.g{background:var(--cp-success-bg);color:var(--el-color-success);border-color:var(--cp-success-border)}
.cp-tag.o{background:var(--cp-warning-bg);color:var(--el-color-warning);border-color:var(--cp-warning-border)}
.cp-tag.r{background:var(--cp-danger-bg);color:var(--el-color-danger);border-color:var(--cp-danger-border)}
.cp-tag.b{background:var(--el-color-primary-light-9);color:var(--el-color-primary);border-color:var(--el-color-primary-light-7)}
.cp-tag.d{background:transparent;color:var(--el-text-color-placeholder);border-color:var(--el-border-color)}
.cp-btn{display:inline-block;padding:7px 14px;font-size:13px;border-radius:4px;
  background:var(--el-color-primary);color:#fff;border:1px solid var(--el-color-primary);cursor:pointer}
.cp-btn:hover{background:var(--el-color-primary-dark-2)}
.cp-btn.pl{background:transparent;color:var(--el-text-color-regular);border-color:var(--el-border-color)}
.cp-btn.pl:hover{color:var(--el-color-primary);border-color:var(--el-color-primary);background:transparent}
.cp-btn.sm{padding:4px 10px;font-size:12.5px}
.cp-inp,select.cp-inp{width:100%;padding:7px 10px;font-size:13px;
  border:1px solid var(--el-border-color);border-radius:4px;background:var(--el-bg-color);
  color:var(--el-text-color-primary)}
.cp-fld{margin-bottom:12px}
.cp-fld label{display:block;font-size:13px;color:var(--el-text-color-regular);margin-bottom:5px}
.cp-map{position:relative;background:var(--cp-panel-bg);
  border:1px solid var(--el-border-color-light);border-radius:4px;overflow:hidden}
.cp-map svg{display:block;width:100%;height:auto}
.cp-maptip{position:absolute;right:10px;top:10px;background:var(--el-bg-color-overlay);
  border:1px solid var(--el-border-color);border-radius:4px;padding:6px 10px;font-size:12px;
  color:var(--el-text-color-secondary)}
.cp-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;
  color:var(--el-text-color-secondary);margin-bottom:9px}
.cp-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;font-style:normal}
#cp-core-flow{flex:0 0 auto;background:var(--el-bg-color);
  border-top:1px solid var(--el-border-color);padding:9px 16px;display:none;
  align-items:center;gap:6px;flex-wrap:wrap}
#cp-core-flow.show{display:flex}
#cp-core-flow>span.t{font-size:13px;font-weight:600;margin-right:5px}
.cp-step{padding:4px 11px;font-size:12.5px;border-radius:14px;cursor:pointer;
  border:1px solid var(--el-border-color);color:var(--el-text-color-regular)}
.cp-step:hover,.cp-step.on{color:var(--el-color-primary);border-color:var(--el-color-primary)}
.cp-step.on{font-weight:600}
.cp-arw{color:var(--el-text-color-placeholder);font-size:11px}
#cp-core-flow .hint{margin-left:auto;font-size:12px;color:var(--el-text-color-placeholder)}
#cp-core-perf{position:absolute;right:14px;bottom:12px;z-index:20;
  background:var(--el-bg-color-overlay);border:1px solid var(--el-border-color);
  border-radius:4px;padding:5px 10px;font-size:11.5px;color:var(--el-text-color-secondary);
  display:flex;align-items:center;gap:8px;font-family:Consolas,Monaco,monospace}
#cp-core-perf b{font-size:14px;color:var(--el-color-success)}
#cp-core-perf .pm{cursor:pointer;padding:1px 6px;border:1px solid var(--el-border-color);
  border-radius:2px;font-size:10.5px}
#cp-core-screen{position:fixed;inset:0;z-index:100;background:var(--navy5,#0A1526);
  display:none;flex-direction:column;padding:18px 22px}
#cp-core-screen.show{display:flex}
#cp-core-screen h1{font-size:23px;color:#F7FAFF;text-align:center;letter-spacing:3px;
  font-weight:800;margin-bottom:14px}
#cp-core-screen .x{position:absolute;right:20px;top:16px;cursor:pointer;color:#9DB2CC;
  font-size:13px;border:1px solid #33507A;border-radius:4px;padding:3px 10px}
.cp-scr-grid{display:grid;grid-template-columns:1fr 2fr 1fr;gap:12px;flex:1 1 auto;min-height:0}
.cp-scr-card{background:#142642;border:1px solid #33507A;border-radius:4px;padding:11px;
  color:#DCE9F7;font-size:13px;overflow:auto}
.cp-scr-card h5{font-size:13px;color:#3E8FD4;margin-bottom:8px;font-weight:700;
  border-left:3px solid #3E8FD4;padding-left:7px}
.cp-scr-kpi{display:flex;justify-content:space-between;padding:5px 0;
  border-bottom:1px dashed #24406B;font-size:12.5px}
.cp-scr-kpi b{color:#22C4A4;font-family:Consolas,monospace;font-size:15px}
.cp-note{font-size:12.5px;color:var(--el-text-color-secondary);line-height:1.85}
.cp-note code{background:var(--el-fill-color-light);padding:1px 5px;border-radius:3px;
  font-family:Consolas,monospace;font-size:12px;color:var(--el-color-primary)}
/* ==== CP.LOG YMS 内嵌 ==== */
#cp-log-yms-frame{width:100%;height:100%;border:0;display:block;background:#0A1526}
.cp-log__wrap{position:absolute;inset:0;display:flex;flex-direction:column}
.cp-log__bar{flex:0 0 auto;padding:7px 14px;background:var(--el-bg-color);
  border-bottom:1px solid var(--el-border-color);font-size:12.5px;
  color:var(--el-text-color-secondary);display:flex;align-items:center;gap:10px}
.cp-log__bar b{color:var(--el-text-color-primary);font-size:13px}
/* ==== 演示模式（全屏铺满，隐藏顶栏/侧栏/面包屑） ==== */
body.cp-present #cp-core-topbar,body.cp-present #cp-core-side,
body.cp-present #cp-core-crumb,body.cp-present #cp-core-flow{display:none!important}
body.cp-present #cp-core-view{padding:0}
#cp-core-exit{position:fixed;right:14px;top:12px;z-index:120;display:none;
  background:var(--el-bg-color-overlay);border:1px solid var(--el-border-color);
  border-radius:4px;padding:5px 11px;font-size:12.5px;cursor:pointer;
  color:var(--el-text-color-regular)}
#cp-core-exit:hover{color:var(--el-color-primary);border-color:var(--el-color-primary)}
body.cp-present #cp-core-exit{display:block}
/* ==== CP.SEC 安防模块 ==== */
.cp-sec__tl{background:var(--el-bg-color);border:1px solid var(--el-border-color-light);
  border-radius:4px;padding:12px 15px;margin-bottom:12px}
.cp-sec__tlhead{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.cp-sec__tlhead select{max-width:280px}
.cp-sec__tlhead .sp{margin-left:auto;font-size:12.5px;color:var(--el-text-color-secondary);
  font-family:Consolas,monospace}
.cp-sec__track{position:relative;height:30px;margin:4px 0 10px}
.cp-sec__track .ln{position:absolute;left:0;right:0;top:14px;height:3px;
  background:var(--el-border-color);border-radius:2px}
.cp-sec__track .fill{position:absolute;left:0;top:14px;height:3px;
  background:var(--el-color-primary);border-radius:2px;transition:width .28s}
.cp-sec__track .nd{position:absolute;top:8px;width:15px;height:15px;margin-left:-7.5px;
  border-radius:50%;background:var(--el-bg-color);border:2px solid var(--el-border-color);
  cursor:pointer;transition:.2s}
.cp-sec__track .nd:hover{border-color:var(--el-color-primary)}
.cp-sec__track .nd.dn{background:var(--el-color-primary);border-color:var(--el-color-primary)}
.cp-sec__track .nd.cu{border-color:var(--el-color-primary);transform:scale(1.42);
  box-shadow:0 0 0 5px var(--el-color-primary-light-9)}
.cp-sec__track .nd.l1{background:var(--el-color-danger);border-color:var(--el-color-danger)}
.cp-sec__nar{display:flex;gap:12px;align-items:flex-start}
.cp-sec__nar .no{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-size:17px;font-weight:800;background:var(--el-color-primary-light-9);
  color:var(--el-color-primary)}
.cp-sec__nar .no.l1{background:var(--cp-danger-bg);color:var(--el-color-danger)}
.cp-sec__nar .tx b{display:block;font-size:14.5px;color:var(--el-text-color-primary);margin-bottom:4px}
.cp-sec__nar .tx p{font-size:13px;color:var(--el-text-color-regular);line-height:1.75}
.cp-sec__nar .tx .mt{margin-top:6px;font-size:12px;color:var(--el-text-color-placeholder);
  font-family:Consolas,monospace}
.cp-sec__pulse{animation:cpPulse 1.3s ease-out infinite}
@keyframes cpPulse{0%{r:6;opacity:.95}100%{r:22;opacity:0}}
.cp-sec__mtx td:first-child{font-weight:600;color:var(--el-text-color-primary)}
.cp-sec__algo{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.cp-sec__algo .it{border:1px solid var(--el-border-color-light);border-radius:4px;padding:10px 12px}
.cp-sec__algo .it b{display:block;font-size:13.5px;margin-bottom:3px}
.cp-sec__algo .it span{font-size:12px;color:var(--el-text-color-secondary)}
.cp-sec__evt{border:1px solid var(--el-border-color-light);border-radius:4px;
  padding:10px 12px;margin-bottom:9px}
.cp-sec__evt.on{border-color:var(--el-color-danger);background:var(--cp-danger-bg)}
.cp-sec__evt b{font-size:13.5px}
.cp-sec__evt .m{font-size:12px;color:var(--el-text-color-secondary);margin-top:4px;
  font-family:Consolas,monospace}
.cp-sec__disp{list-style:none}
.cp-sec__disp li{position:relative;padding:0 0 13px 20px;font-size:12.5px;
  color:var(--el-text-color-regular);border-left:2px solid var(--el-border-color);margin-left:5px}
.cp-sec__disp li:last-child{border-left-color:transparent;padding-bottom:0}
.cp-sec__disp li::before{content:"";position:absolute;left:-6px;top:3px;width:9px;height:9px;
  border-radius:50%;background:var(--el-border-color)}
.cp-sec__disp li.dn::before{background:var(--el-color-primary)}
.cp-sec__disp li b{color:var(--el-text-color-primary);font-family:Consolas,monospace;margin-right:6px}
</style>
</head>
<body>
<div id="cp-core-topbar">
  <div class="cp-core__brand">合肥阳光电源产业园区</div>
  <nav class="cp-core__nav" id="cp-core-nav"></nav>
  <div class="cp-core__tools">
    <span class="th" id="cp-core-present">⛶ 演示</span>
    <span class="th" id="cp-core-theme">夜间</span>
    <div class="cp-core__avatar"></div><b>admin</b>
  </div>
</div>
<div id="cp-core-body">
  <aside id="cp-core-side"></aside>
  <div id="cp-core-main">
    <div id="cp-core-crumb"></div>
    <div id="cp-core-view"></div>
    <div id="cp-core-flow"></div>
    <div id="cp-core-perf"><span>响应</span><b id="cp-core-ms">—</b><span>ms</span>
      <span class="pm" id="cp-core-pmode">性能模式：关</span></div>
  </div>
</div>

<style>
  :root{

    --red:#E2231A; --teal:#1AA085; --teal2:#22C4A4; --gold:#E8A33D; --violet:#7B6BD6;

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;padding:10px 20px 0;flex:none}

  #vSim{grid-template-columns:minmax(460px,820px) 1fr;gap:12px}
  .col{display:flex;flex-direction:column;gap:10px;min-height:0}
  .card{background:linear-gradient(180deg,rgba(30,53,89,.46),rgba(20,38,66,.3));border:1px solid var(--line);
    border-radius:13px;padding:10px 12px;display:flex;flex-direction:column;min-height:0}
  .ch{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex:none}
  .ch .t{font-size:12.5px;font-weight:800}
  .ch .s{font-size:8.5px;color:var(--teal);font-weight:700;letter-spacing:1px}
  .ch .r{margin-left:auto;font-size:10px;color:var(--mute);font-weight:700;text-align:right;line-height:1.4}

  .maphost{display:flex;flex:1;min-height:0}
  .mapbox{position:relative;flex:1;min-height:200px;border-radius:10px;overflow:hidden;background:#061020;
    border:1px solid #3A5A82}
  .mapbox svg{position:absolute;inset:0;width:100%;height:100%}
  .veh{transition:transform 1.2s linear}
  .veh .bd{transition:transform .42s cubic-bezier(.4,0,.25,1);transform-box:fill-box;transform-origin:center}
  .veh .plate{font-size:13px;font-weight:800;text-anchor:middle;paint-order:stroke;
    stroke:#04101E;stroke-width:5px;stroke-linejoin:round}
  .veh.off{opacity:0;pointer-events:none}
  .ring{fill:none;stroke-width:2.4;opacity:0;transform-box:fill-box;transform-origin:center}
  body.playing .veh.foc .ring{animation:ping 2.2s ease-out infinite}
  body.playing .veh.foc .ring.b{animation-delay:1.1s}
  @keyframes ping{0%{transform:scale(.3);opacity:.85}100%{transform:scale(2.1);opacity:0}}
  .mdock{transition:fill .55s ease,stroke .55s ease}
  .trail{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ovpulse{animation:ovp 1.5s ease-in-out infinite}
  @keyframes ovp{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.9;transform:scale(1.12)}}
  .navimg{width:100%;display:block;flex:1;min-height:0;object-fit:cover;object-position:top center}

    opacity:0;transform:translateY(8px);transition:all .4s ease;pointer-events:none}
  .toast.on{opacity:1;transform:none}
  .toast .tt{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:2px}
  .toast .tb{font-size:10.5px;color:var(--ice);line-height:1.5}
  .toast.ok{border-color:var(--teal)} .toast.ok .tt{color:var(--teal2)}
  .hint{position:absolute;right:12px;top:10px;font-size:10px;color:var(--mute);background:rgba(8,18,34,.85);
    padding:4px 10px;border-radius:20px;border:1px solid var(--line);z-index:7}

  .badge{width:32px;height:32px;border-radius:9px;background:var(--red);display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:15px;color:#fff;flex:none}
  .pts{list-style:none;overflow:auto;flex:1}
  .pts li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;opacity:0;transform:translateY(6px)}
  .pts li.show{opacity:1;transform:none;transition:all .5s ease}
  .pts li .pk{width:6px;height:6px;border-radius:2px;background:var(--teal);margin-top:6px;flex:none}
  .pts li .pt{font-size:12px;line-height:1.55;color:#EDF3FB}
  .pts li .pt b{color:#fff}
  .sys{flex:none;margin-top:5px;padding-top:5px;border-top:1px solid var(--line);display:flex;gap:5px;flex-wrap:wrap}
  .sy{font-size:10px;font-weight:700;color:var(--ice);background:#132844;border:1px solid #3A5A82;
    padding:3px 8px;border-radius:6px}
  .sy em{color:var(--teal2);font-style:normal;font-weight:800}

  .vlist{list-style:none;overflow:auto;flex:1}
  .vlist li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;margin-bottom:4px;
    background:rgba(14,28,51,.6);border:1px solid var(--line);transition:all .4s}
  .vlist li.foc{border-color:var(--red);background:rgba(226,35,26,.1);box-shadow:0 0 0 3px rgba(226,35,26,.08)}
  .vlist li.gone{opacity:.42}
  .vlist .sw{width:8px;height:24px;border-radius:3px;flex:none}
  .vlist .pl2{font-size:11.5px;font-weight:800;color:#fff;font-family:"Arial Narrow",Arial,sans-serif}
  .vlist .bz{font-size:9.5px;color:var(--mute);margin-top:1px}
  .vlist .v2{text-align:right;flex:none}
  .vlist .sg2{font-size:10.5px;font-weight:800;color:var(--teal2)}
  .vlist .tm{font-size:9px;color:var(--mute);margin-top:1px}

  .tf{list-style:none;overflow:auto;flex:1}
  .tf li{display:flex;gap:8px;align-items:flex-start;padding:5px 7px;border-radius:8px;margin-bottom:4px;
    background:rgba(14,28,51,.55);border:1px solid var(--line)}
  .tf li .sq{width:18px;height:18px;border-radius:5px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:9.5px;font-weight:800;background:var(--navy3);color:var(--mute)}
  .tf li .n1{font-size:11.5px;font-weight:800;color:#EDF3FB;line-height:1.3}
  .tf li .n2{font-size:9.5px;color:var(--mute);margin-top:1px}
  .tf li .st{font-size:9px;font-weight:800;color:var(--mute);margin-left:auto;flex:none}
  .tf li.done{border-color:rgba(26,160,133,.5);background:rgba(26,160,133,.08)}
  .tf li.done .sq{background:var(--teal);color:#fff} .tf li.done .st{color:var(--teal2)}
  .tf li.act{border-color:var(--red);background:rgba(226,35,26,.1)}
  .tf li.act .sq{background:var(--red);color:#fff} .tf li.act .st{color:#ff8b84} .tf li.act .n1{color:#fff}

  /* ============ 司机端 ============ */

function h(a,b){ var x=Math.sin(a*127.1+b*311.7)*43758.5453; return x-Math.floor(x); }
function queueFor(gi,i,step,min){
  // 该月台已预约 / 已签到、正在排队等待进入的车辆
  var r=h(gi*29+i, step+11), n=(r<0.30?0:(r<0.72?1:2));
  if(min && n<min) n=min;
  var q=[];
  for(var m=0;m<n;m++){
    q.push({pl:BGPLATE[(gi*7+i*3+m+step)%BGPLATE.length],
            wait:Math.floor(h(gi+i*5+m,step)*26)+4,
            gate:(gi<2?"西门":"东门")});
  }
  return q;
}
function dockState(gi,i,step){
  var r=h(gi*13+i, step+5);
  if(r<0.56) return {s:"busy",pl:BGPLATE[(gi*6+i+step)%BGPLATE.length],bz:BGBIZ[(gi*3+i)%BGBIZ.length],
    pg:Math.floor(h(i,step)*80)+15,du:Math.floor(h(i+3,step)*70)+8,q:queueFor(gi,i,step,0)};
  if(r<0.64) return {s:"over",pl:BGPLATE[(gi*4+i+step)%BGPLATE.length],bz:BGBIZ[(gi+i)%BGBIZ.length],
    pg:92,du:Math.floor(h(i+7,step)*30)+125,q:queueFor(gi,i,step,1)};
  if(r<0.72) return {s:"lock",pl:"—",bz:"已预锁待入",pg:0,du:0,q:queueFor(gi,i,step,1)};
  return {s:"idle",pl:"—",bz:"空闲",pg:0,du:0,q:queueFor(gi,i,step,0)};

/* ---------- 行驶轨迹（带箭头，与车辆同色） ---------- */
function trailPts(v,i,k){
  var out=[];
  for(var j=v.enterIdx;j<=k;j++){
    var pa=v.stages[j].path||[];
    for(var q=0;q<pa.length;q++){
      var p=pa[q];
      var py=sy(p[1]);
      if(!out.length || Math.abs(out[out.length-1][0]-p[0])>0.5 || Math.abs(out[out.length-1][1]-py)>0.5)
        out.push([p[0],py]);
    }
  }
  return out;
}
/* 轨迹侧向偏移：按"道路轴向"固定分道（与行驶方向无关），保证任意两车在同一
   路段上都并排显示；再叠加 ±1 的方向微偏移，使同一辆车的往返也能区分。
   竖向路段左右错开，横向路段上下错开（竖直分量按 SY 同步压缩） */
var TRAIL_OFF = [-10.5, -3.5, 3.5, 10.5];
var TRAIL_SUB = 2.2;

/* 两条偏移段所在直线的交点（平行 / 反向时返回 null） */
function lineX(s1,s2){
  var x1=s1.a[0],y1=s1.a[1],x2=s1.b[0],y2=s1.b[1];
  var x3=s2.a[0],y3=s2.a[1],x4=s2.b[0],y4=s2.b[1];
  var den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if(Math.abs(den)<1e-6) return null;
  var t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/den;
  // 交点离段末过远说明并非真实拐角，放弃
  if(t<-2.5||t>3.5) return null;
  return [x1+t*(x2-x1), y1+t*(y2-y1)];
}
/* 由偏移段序列求折线顶点：拐角用交点，掉头用原两端点 */
function buildVerts(segs){
  var V=[[segs[0].a[0],segs[0].a[1]]];
  for(var i=0;i<segs.length-1;i++){
    var p=lineX(segs[i],segs[i+1]);
    if(p) V.push(p);
    else { V.push([segs[i].b[0],segs[i].b[1]]); V.push([segs[i+1].a[0],segs[i+1].a[1]]); }
  }
  var lastSeg=segs[segs.length-1];
  V.push([lastSeg.b[0],lastSeg.b[1]]);
  // 合并重复点
  var out=[V[0]];
  for(var k=1;k<V.length;k++){
    var q=out[out.length-1];
    if(Math.abs(V[k][0]-q[0])>0.4||Math.abs(V[k][1]-q[1])>0.4) out.push(V[k]);
  }
  return out;
}
/* 折线倒圆角：拐角以二次贝塞尔过渡，线条连续平滑 */
function roundPath(V,r){
  function fx(p){ return p[0].toFixed(1)+" "+p[1].toFixed(1); }
  function lerp(p,q,t){ return [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t]; }
  function dist(p,q){ var dx=q[0]-p[0],dy=q[1]-p[1]; return Math.sqrt(dx*dx+dy*dy); }
  if(V.length<3) return "M"+fx(V[0])+" L"+fx(V[V.length-1]);
  var d="M"+fx(V[0]);
  for(var i=1;i<V.length-1;i++){
    var p0=V[i-1],p1=V[i],p2=V[i+1];
    var l1=dist(p0,p1), l2=dist(p1,p2);
    // 近似共线则不倒角
    var c=((p1[0]-p0[0])*(p2[0]-p1[0])+(p1[1]-p0[1])*(p2[1]-p1[1]))/((l1*l2)||1);
    var rr=Math.min(r, l1*0.45, l2*0.45);
    if(c>0.985 || rr<1.5){ d+=" L"+fx(p1); continue; }
    d+=" L"+fx(lerp(p1,p0,rr/l1))+" Q"+fx(p1)+" "+fx(lerp(p1,p2,rr/l2));
  }
  return d+" L"+fx(V[V.length-1]);
}

function drawTrails(s){
  var L=$("tlayer"); L.innerHTML="";
  VEH.forEach(function(v,i){
    var k=s.ix[i];
    if(k<0) k=v.stages.length-1;                 // 已离场：保留完整轨迹
    if(k<v.enterIdx) return;                     // 未入园：不画
    var pts=trailPts(v,i,k);
    if(pts.length<2) return;
    var foc=(i===s.f), off=TRAIL_OFF[i]||0;

    // 逐段按道路轴向分道偏移
    var segs=[];
    for(var q=1;q<pts.length;q++){
      var a=pts[q-1], b=pts[q];
      var dx=b[0]-a[0], dy=b[1]-a[1], len=Math.sqrt(dx*dx+dy*dy);
      if(len<0.8) continue;
      var vert=Math.abs(dx)<Math.abs(dy);
      var dir=vert?(dy>0?1:-1):(dx>0?1:-1);
      var tot=off+dir*TRAIL_SUB;
      var ox=vert?tot:0, oy=vert?0:tot*SY;
      segs.push({a:[a[0]+ox,a[1]+oy], b:[b[0]+ox,b[1]+oy], len:len,
                 ang:Math.atan2(dy,dx)*180/Math.PI});
    }
    if(!segs.length) return;

    // 先求相邻偏移段的交点作为拐角顶点，再以二次贝塞尔倒圆角
    var V=buildVerts(segs);
    var d=roundPath(V,11);

    // 底衬（深色描边）提升在地图上的可读性
    L.appendChild(el("path",{d:d,stroke:"#04101E","stroke-width":foc?9.5:8,
      "stroke-opacity":.78,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"}));
    var ln=el("path",{d:d,stroke:v.color,"stroke-width":foc?5:4,
      "stroke-opacity":foc?1:.82,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"});
    ln.setAttribute("class","trail"); L.appendChild(ln);

    // 沿途方向箭头：按顶点序列的直线段放置，避开圆角区
    for(var vi=1;vi<V.length;vi++){
      var p0=V[vi-1], p1=V[vi];
      var sdx=p1[0]-p0[0], sdy=p1[1]-p0[1], slen=Math.sqrt(sdx*sdx+sdy*sdy);
      if(slen<34) continue;
      var sang=Math.atan2(sdy,sdx)*180/Math.PI;
      var n=Math.max(1,Math.floor(slen/95));
      // 往返方向的箭头错开相位，避免同一路段上下箭头叠在一起
      var vv=Math.abs(sdx)<Math.abs(sdy);
      var ph=((vv?sdy:sdx)>0)?0:0.42;
      for(var m=1;m<=n;m++){
        var f=Math.min(0.94,(m+ph)/(n+1));
        var mx=p0[0]+sdx*f, my=p0[1]+sdy*f;
        L.appendChild(el("path",{d:"M-8 -7.5 L9.5 0 L-8 7.5 Z",fill:v.color,
          "fill-opacity":foc?1:.85,stroke:"#04101E","stroke-width":1.5,
          transform:"translate("+mx.toFixed(1)+","+my.toFixed(1)+") rotate("+sang.toFixed(1)+")"}));
      }
    }

    // 末端箭头（当前朝向）
    var vE=V[V.length-1], vP=V[V.length-2];
    var eang=Math.atan2(vE[1]-vP[1],vE[0]-vP[0])*180/Math.PI;
    L.appendChild(el("path",{d:"M-10.5 -9.5 L12.5 0 L-10.5 9.5 Z",fill:v.color,
      stroke:"#04101E","stroke-width":1.8,"fill-opacity":1,
      transform:"translate("+vE[0].toFixed(1)+","+vE[1].toFixed(1)+") rotate("+eang.toFixed(1)+")"}));
  });
}

function drawCallouts(s){
  var L=$("clayer"); L.innerHTML="";
  // 超时月台脉冲高亮（第 6–10 步 C-01）
  if(idx>=5 && idx<=9){
    var cC=DGROUPS[2].cells[0];
    var ring=el("rect",{x:cC[0]-9,y:sy(cC[1])-9,width:cC[2]+18,height:sy(cC[3])+18,rx:5,fill:"none",

/* 行驶速度模型：地图 1 单位 ≈ 1 m（竖向已按 SY 压缩，算里程时还原）。
   园区限速 YARD_KMH，按演示时间压缩倍数 TIME_FOLD 折算为屏幕速度；
   播放档位越慢，屏幕速度同比放慢。
   整条路径用 rAF 连续插值，只在起步与到位各做一次加减速，
   中间所有转折点保持匀速通过，不再逐段缓入缓出。 */
var YARD_KMH = 20;      // 园区限速（km/h）
var TIME_FOLD = 29;     // 演示时间压缩倍数（慢速 1× 档基准）
var ACC_F = 0.18, DEC_F = 0.20;   // 起步加速段 / 到位减速段占全程时间比例
function speedUPS(){ return (YARD_KMH/3.6)*TIME_FOLD*(5400/interval); }

/* 梯形速度曲线：起步加速 → 全程匀速 → 到位减速，返回已行驶里程占比 */
function speedProfile(u){
  var a=ACC_F, d=DEC_F, v=1/(1-(a+d)/2);
  if(u<a) return v*u*u/(2*a);
  if(u>1-d) return 1-v*(1-u)*(1-u)/(2*d);
  return v*(a/2+(u-a));
}
function stopVeh(i){
  if(rafT[i]){ cancelAnimationFrame(rafT[i]); rafT[i]=null; }
  clearTimeout(moveT[i]);
  var nd=vnodes[i];
  if(nd){ nd.wrap.classList.remove("mv"); nd.wrap.style.transition=""; }
}
function placeVeh(i,x,y){
  var nd=vnodes[i];
  nd.wrap.style.transition="none";
  nd.cur=[x,y];
  nd.wrap.style.transform="translate("+x+"px,"+y+"px)";
  // 强制回流后恢复过渡属性，避免下次动画被残留状态影响
  void nd.wrap.getBoundingClientRect();
  nd.wrap.style.transition="";
}
function moveVeh(i,path,budget){
  stopVeh(i);
  var nd=vnodes[i];
  if(!path||!path.length) return;
  // 组装完整折线（起点为当前位置），并剔除重复点
  var pts=[[nd.cur[0],nd.cur[1]]];
  for(var q=0;q<path.length;q++){
    var px=path[q][0], py=sy(path[q][1]), lp=pts[pts.length-1];
    if(Math.abs(px-lp[0])>0.3||Math.abs(py-lp[1])>0.3) pts.push([px,py]);
  }
  if(pts.length<2) return;
  // 分段长度：屏幕长度用于插值，真实里程用于计时
  var segL=[], totalS=0, totalM=0;
  for(q=1;q<pts.length;q++){
    var dx=pts[q][0]-pts[q-1][0], dy=pts[q][1]-pts[q-1][1];
    var sl=Math.sqrt(dx*dx+dy*dy);
    segL.push(sl); totalS+=sl;
    totalM+=Math.sqrt(dx*dx+(dy/SY)*(dy/SY));
  }
  if(totalS<0.6){ placeVeh(i,pts[pts.length-1][0],pts[pts.length-1][1]); return; }
  var dur=Math.max(800,Math.min(budget,totalM/speedUPS()*1000));
  nd.wrap.style.transition="none";
  nd.wrap.classList.add("mv");
  var t0=null;
  function frame(ts){
    if(t0===null) t0=ts;
    var u=Math.min(1,(ts-t0)/dur);
    var target=speedProfile(u)*totalS;
    var acc=0,k=0;
    while(k<segL.length-1 && acc+segL[k]<=target){ acc+=segL[k]; k++; }
    var f=segL[k]>0?Math.min(1,Math.max(0,(target-acc)/segL[k])):1;
    var x=pts[k][0]+(pts[k+1][0]-pts[k][0])*f;
    var y=pts[k][1]+(pts[k+1][1]-pts[k][1])*f;
    nd.cur=[x,y];
    nd.wrap.style.transform="translate("+x+"px,"+y+"px)";
    // 车头朝向：取当前所在段的真实方向角，按最短弧转向（避免绕大圈或翻转）
    var sdx=pts[k+1][0]-pts[k][0], sdy=pts[k+1][1]-pts[k][1];
    if(Math.abs(sdx)>2||Math.abs(sdy)>2){
      var raw=Math.atan2(sdy,sdx)*180/Math.PI;
      var diff=((raw-nd.angle+540)%360)-180;
      if(Math.abs(diff)>0.5){
        nd.angle+=diff;
        nd.bd.style.transform="rotate("+nd.angle.toFixed(1)+"deg)";
      }
    }
    if(u<1) rafT[i]=requestAnimationFrame(frame);
    else {
      var last=pts[pts.length-1];
      nd.cur=[last[0],last[1]];
      nd.wrap.classList.remove("mv");
      nd.wrap.style.transition="";
      rafT[i]=null;
    }
  }
  rafT[i]=requestAnimationFrame(frame);
}

/* ---------- 时间轴与控制 ---------- */
function buildTL(){
  var t=$("tl"); t.innerHTML="";
  TL.forEach(function(s,i){
    var d=document.createElement("div"); d.className="tlx";
    d.innerHTML='<div class="tn">'+s.t+'</div><div class="tt2">'+s.n.split(" · ")[0]+'</div>';
    d.addEventListener("click",function(){ go(i); pause(); });
    t.appendChild(d);
  });
  $("indAll").textContent=TL.length;
}
function go(i){
  var p=idx;
  idx=Math.max(0,Math.min(TL.length-1,i));
  renderSim(p);
}
function next(){ if(idx>=TL.length-1){ idx=0; renderSim(); } else go(idx+1); }
function play(){ playing=true; document.body.classList.add("playing"); $("hint").style.display="";
  $("play").textContent="⏸ 暂停"; clearInterval(timer); timer=setInterval(next,interval); }
function pause(){ playing=false; document.body.classList.remove("playing"); $("hint").style.display="none";
  $("play").textContent="▶ 播放"; clearInterval(timer); }

$("play").addEventListener("click",function(){ playing?pause():play(); });
$("next").addEventListener("click",function(){ next(); pause(); });
$("prev").addEventListener("click",function(){ go(idx-1); pause(); });
$("restart").addEventListener("click",function(){ go(0); play(); });
$("bar").addEventListener("click",function(e){
  var r=$("bar").getBoundingClientRect();
  go(Math.round(((e.clientX-r.left)/r.width)*(TL.length-1))); pause();
});
Array.prototype.forEach.call(document.querySelectorAll(".speed button"),function(b){

    Array.prototype.forEach.call(document.querySelectorAll(".speed button"),function(x){x.classList.remove("on");});

  });
});
Array.prototype.forEach.call($("views").querySelectorAll("button"),function(b){
  b.addEventListener("click",function(){
    Array.prototype.forEach.call($("views").querySelectorAll("button"),function(x){x.classList.remove("on");});
    b.classList.add("on");
    view=b.dataset.v;
    ["vSim","vFull","vDrv","vGate","vDock","vCtl","vFunc"].forEach(function(v){ $(v).classList.toggle("on",v===view); });
    document.body.classList.toggle("fullview",view==="vFull");
    document.body.classList.toggle("nosteps",view==="vFunc"||view==="vCtl");
    document.body.classList.toggle("funcview",view==="vFunc");
    var host=(view==="vFull")?$("mapHostFull"):$("mapHost");
    if($("mapbox").parentNode!==host) host.appendChild($("mapbox"));
    if(view==="vDock"||view==="vCtl"||view==="vGate") animBars();
  });
});
document.addEventListener("keydown",function(e){
  if(e.code==="KeyF"){
    var tgt=(view==="vFull")?"vSim":"vFull";
    var btn=$("views").querySelector('button[data-v="'+tgt+'"]');
    if(btn) btn.click();
    return;
  }
  if(e.code==="KeyD"){
    var b2=$("views").querySelector('button[data-v="vDrv"]');
    if(b2) b2.click();
    return;
  }
  if(e.code==="Space"){ e.preventDefault(); playing?pause():play(); }
  else if(e.code==="ArrowRight"){ next(); pause(); }
  else if(e.code==="ArrowLeft"){ go(idx-1); pause(); }
});

/* ---------- 初始化 ---------- */
buildMap(); buildVeh(); buildTL(); buildDrv(); buildCtl(); renderFunc(); renderSim();
if(reduce) pause(); else play();
})();

CP.SEC.camLayer=function(o){
  o=o||{};var sy=CP.core.map.sy,s='';
  if(o.zones)CP.SEC.data.ZONE.forEach(function(z){
    var p=z.pts.split(' ').map(function(pt){var a=pt.split(',');
      return a[0]+','+sy(+a[1]).toFixed(1)}).join(' ');
    var al=(o.alarmZone===z.k);
    s+='<polyline points="'+p+'" fill="none" stroke="'
      +(al?'var(--el-color-danger)':(z.st==='旁路'?'var(--el-text-color-placeholder)':'var(--el-color-success)'))
      +'" stroke-width="'+(al?5:3)+'" stroke-dasharray="'+(z.st==='旁路'?'7 5':'none')+'" opacity=".9"/>';
  });
  if(o.emr)CP.SEC.data.EMR.forEach(function(e){
    var c=e.t==='AED'?'#E2231A':e.t==='FS'?'#E8A33D':'#1AA085';
    s+='<rect x="'+(e.x-7)+'" y="'+(sy(e.y)-7).toFixed(1)+'" width="14" height="14" rx="3" fill="'+c
      +'" stroke="#fff" stroke-width="1.4"/><text x="'+e.x+'" y="'+(sy(e.y)+3.6).toFixed(1)
      +'" font-size="8" font-weight="800" text-anchor="middle" fill="#fff">'
      +(e.t==='AED'?'A':e.t==='FS'?'F':'+')+'</text>';
  });
  if(o.route){
    var W=CP.SEC.data.UAV.wps;
    var pts=W.map(function(p){return p.x+','+sy(p.y).toFixed(1)}).join(' ');
    s+='<polyline points="'+pts+'" fill="none" stroke="var(--el-color-primary)" '
      +'stroke-width="2" stroke-dasharray="9 6" opacity=".72"/>';
    W.forEach(function(p,i){
      if(i===W.length-1)return;
      var done=(o.wp!==undefined&&i<=o.wp);
      s+='<circle cx="'+p.x+'" cy="'+sy(p.y).toFixed(1)+'" r="'+(done?5.5:4)+'" fill="'
        +(done?'var(--el-color-primary)':'var(--cp-panel-bg)')
        +'" stroke="var(--el-color-primary)" stroke-width="1.6"/>'
        +'<text x="'+(p.x+8)+'" y="'+(sy(p.y)-6).toFixed(1)+'" font-size="9.5" font-weight="700" '
        +'fill="var(--el-text-color-secondary)">W'+i+'</text>';
    });
    if(o.wp!==undefined){
      var cur=W[Math.min(o.wp,W.length-1)],cy2=sy(cur.y);
      s+='<circle cx="'+cur.x+'" cy="'+cy2.toFixed(1)+'" r="9" fill="var(--el-color-primary)" '
        +'opacity=".4" class="cp-sec__pulse"/>'
        +'<g transform="translate('+cur.x+','+cy2.toFixed(1)+')">'
        +'<line x1="-9" y1="-9" x2="9" y2="9" stroke="var(--el-color-primary)" stroke-width="2"/>'
        +'<line x1="9" y1="-9" x2="-9" y2="9" stroke="var(--el-color-primary)" stroke-width="2"/>'
        +'<circle cx="-9" cy="-9" r="3.4" fill="none" stroke="var(--el-color-primary)" stroke-width="1.6"/>'
        +'<circle cx="9" cy="-9" r="3.4" fill="none" stroke="var(--el-color-primary)" stroke-width="1.6"/>'
        +'<circle cx="-9" cy="9" r="3.4" fill="none" stroke="var(--el-color-primary)" stroke-width="1.6"/>'
        +'<circle cx="9" cy="9" r="3.4" fill="none" stroke="var(--el-color-primary)" stroke-width="1.6"/>'
        +'<rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="var(--el-color-primary)"/></g>'
        +'<text x="'+(cur.x+15)+'" y="'+(cy2+4).toFixed(1)+'" font-size="12" font-weight="800" '
        +'fill="var(--el-color-primary)">UAV-01</text>';
    }
  }
  if(o.hot!==undefined&&o.hot){
    s+='<circle cx="830" cy="'+sy(330).toFixed(1)+'" r="13" fill="var(--el-color-danger)" '
      +'opacity=".3" class="cp-sec__pulse"/>'
      +'<circle cx="830" cy="'+sy(330).toFixed(1)+'" r="6" fill="var(--el-color-danger)" '
      +'stroke="#fff" stroke-width="1.4"/>'
      +'<text x="842" y="'+(sy(330)+4).toFixed(1)+'" font-size="11.5" font-weight="800" '
      +'fill="var(--el-color-danger)">热斑 ΔT18℃</text>';
  }
  if(o.cams)CP.SEC.data.CAM.forEach(function(c){
    var al=(o.alarmCam===c.id),cy=sy(c.y);
    if(al)s+='<circle cx="'+c.x+'" cy="'+cy.toFixed(1)+'" r="6" fill="var(--el-color-danger)" '
      +'opacity=".55" class="cp-sec__pulse"/>';
    s+='<circle cx="'+c.x+'" cy="'+cy.toFixed(1)+'" r="'+(al?7:5)+'" fill="'
      +(al?'var(--el-color-danger)':'var(--el-color-primary)')+'" stroke="#fff" stroke-width="1.4"/>';
    if(al)s+='<text x="'+(c.x+11)+'" y="'+(cy-6).toFixed(1)+'" font-size="12" font-weight="800" '
      +'fill="var(--el-color-danger)">'+c.id+'</text>';
  });
  return s;
};

CP.SEC.renderSim=function(v){

  var track='<div class="cp-sec__track"><div class="ln"></div><div class="fill" style="width:'
    +(ix/(S.steps.length-1)*100).toFixed(1)+'%"></div>';
  S.steps.forEach(function(x,i){
    track+='<div class="nd'+(i<ix?' dn':'')+(i===ix?' cu':'')+(x.lv==='L1'&&i<=ix?' l1':'')
      +'" data-i="'+i+'" title="'+x.c+' '+x.ti+'" style="left:'+(i/(S.steps.length-1)*100).toFixed(1)+'%"></div>';
  });
  track+='</div>';
  var disp='';S.steps.forEach(function(x,i){
    disp+='<li class="'+(i<=ix?'dn':'')+'"><b>'+x.c+'</b>'+x.ti
      +(x.lv?' <span class="cp-tag r" style="transform:scale(.85)">'+x.lv+'</span>':'')+'</li>'});

   +'<div class="tx"><b>'+sp.c+'　'+sp.ti
   +(sp.lv?' <span class="cp-tag r">'+sp.lv+' 紧急</span>':'')+'</b><p>'+sp.nar+'</p>'
   +'<div class="mt">'+sp.mt+'</div></div></div></div>'
   +'<div class="cp-grid31">'
   +'<div class="cp-card"><h4>园区安防电子地图<span class="hint">告警点位闪烁定位 · 沿用 YMS V5.0 园区模型</span></h4><div class="bd">'
   +'<div class="cp-legend"><span><i style="background:var(--el-color-primary)"></i>AI 摄像机</span>'
   +'<span><i style="background:var(--el-color-danger)"></i>告警点位</span>'
   +'<span><i style="background:var(--el-color-success)"></i>周界防区正常</span>'
   +'<span><i style="background:var(--el-text-color-placeholder)"></i>防区旁路</span></div>'
   +'<div class="cp-map">'+CP.core.map.svg({hlBld:(ix>=1?S.hlBld:null),
      extra:CP.SEC.camLayer(S.uav
        ?{zones:1,route:1,wp:sp.wp,hot:(ix>=4?1:0)}
        :{cams:1,zones:1,alarmCam:(ix>=1?S.cam:null),
          alarmZone:(S.id==='SC-SEC-02'&&ix>=1?'K-07':null)})})
   +'<div class="cp-maptip">'+(S.uav
      ?'固定航线 R-01 · 8 个航点 · 巡航 60m / 抵近 15m'
      :CP.SEC.data.CAM.length+' 个演示点位 · 4 个周界防区 · 全量 5928 路以聚合表达')+'</div>'
   +'</div></div></div>'
   +'<div><div class="cp-card"><h4>处置闭环</h4><div class="bd"><ul class="cp-sec__disp">'+disp+'</ul></div></div>'
   +'<div class="cp-card"><h4>关联事件</h4><div class="bd">'
   +(function(){
      var E={'SC-SEC-01':['人员处于吊装物下方','EV-SEC-20260903-0117','PK01-M06-F01 · 4#-1F-JK12',1,10],
             'SC-SEC-02':['周界翻越入侵','EV-SEC-20260903-0122','PK01-PUB · K-07 · W#-JK07',1,8],
             'SC-SEC-03':['M5 屋面光伏组件热斑','EV-SEC-20260903-0151','PK01-M05-RF · UAV-01 · ΔT 18℃',4,12]}[S.id];
      if(ix<E[3])return '<div class="cp-note">本剧本当前步骤尚未产生告警事件。</div>';
      return '<div class="cp-sec__evt on"><b>'+E[0]+'</b> <span class="cp-tag '
        +(ix>=E[4]?'g':'r')+'">'+(ix>=E[4]?'已闭环':'处置中')+'</span>'
        +'<div class="m">'+E[1]+'<br>'+E[2]+'</div></div>';
    })()
   +(S.uav?('<div class="cp-card"><h4>飞行状态</h4><div class="bd"><table class="cp-tb"><tbody>'
     +'<tr><td>航点</td><td>W'+(sp.wp===undefined?0:sp.wp)+' / W7</td></tr>'
     +'<tr><td>高度</td><td>'+(ix<2?'0 m':(sp.wp===3?'15 m 抵近':'60 m 巡航'))+'</td></tr>'
     +'<tr><td>电量</td><td>'+Math.max(38,96-ix*4.5).toFixed(0)+'%</td></tr>'
     +'<tr><td>视频上传</td><td><span class="cp-tag '+(ix>=2?'g':'d')+'">'

     +'</tbody></table></div></div>'):'')
   +'</div></div></div>';
  var q=function(i){return document.getElementById(i)};
  q('cp-sec-scn').onchange=function(){CP.SEC.stop();CP.SEC.st.sc=+this.value;CP.SEC.st.ix=0;CP.core.render()};
  q('cp-sec-prev').onclick=function(){CP.SEC.stop();if(CP.SEC.st.ix>0){CP.SEC.st.ix--;CP.core.render()}};
  q('cp-sec-next').onclick=function(){CP.SEC.stop();
    if(CP.SEC.st.ix<S.steps.length-1){CP.SEC.st.ix++;CP.core.render()}};
  q('cp-sec-reset').onclick=function(){CP.SEC.stop();CP.SEC.st.ix=0;CP.core.render()};
  q('cp-sec-play').onclick=function(){
    if(CP.SEC.st.tm){CP.SEC.stop();this.textContent='▶ 播放';return}
    this.textContent='⏸ 暂停';
    CP.SEC.st.tm=setInterval(function(){
      if(CP.SEC.st.ix>=S.steps.length-1){CP.SEC.stop();CP.core.render();return}
      CP.SEC.st.ix++;CP.core.render();
    },1900);
  };
  v.querySelectorAll('.cp-sec__track .nd').forEach(function(n){
    n.onclick=function(){CP.SEC.stop();CP.SEC.st.ix=+n.dataset.i;CP.core.render()}});
};

    return /^(BLD|ROADS|GATES|GATEDEF|DGROUPS|TL|VEH|MENU|DRV|buildMap|renderSim|go|play|next|sy)$/.test(k)});
  r.push(['A8 无裸全局（除 CP）',bad.length===0,bad.join(',')||'ok']);
  bad=[].map.call(document.querySelectorAll('[id]'),function(e){return e.id})
        .filter(function(i){return i.indexOf('cp-')!==0});
  r.push(['A8 DOM id 带 cp- 前缀',bad.length===0,bad.join(',')||'ok']);
  var n=document.querySelectorAll('svg *').length;
  r.push(['A9 SVG 节点 ≤1500',n<=1500,n+' 节点']);
  r.push(['一级菜单八项且顺序正确',
    [].map.call(document.querySelectorAll('#cp-core-nav a'),function(a){return a.textContent}).join('|')
    ==='工作台|智慧物流|智慧消防|智慧安防|宿舍管理|外协系统|运营报表|系统管理','ok']);
  r.push(['A15 建筑数 = YMS 原始 30',CP.core.map.BLD.length===30,CP.core.map.BLD.length+' 个']);
  r.push(['SY 未被修改 = 0.68',CP.core.map.SY===0.68,String(CP.core.map.SY)]);
  var ok=true,ids={};
  CP.SEC.data.SCN.forEach(function(s){if(ids[s.id])ok=false;ids[s.id]=1;
    s.steps.forEach(function(x){if(!x.c||!x.ti||!x.nar)ok=false})});
  r.push(['A6 剧本步骤完整且 ID 唯一',ok,CP.SEC.data.SCN.length+' 条剧本']);
  r.push(['A7 每条剧本含关键分级节点',
    CP.SEC.data.SCN.every(function(s){return s.steps.some(function(x){return !!x.lv})}),'ok']);
  var u=CP.SEC.data.SCN.filter(function(s){return s.uav})[0];
  r.push(['无人机剧本航点均合法',!!u&&u.steps.every(function(x){
    return x.wp!==undefined&&x.wp>=0&&x.wp<CP.SEC.data.UAV.wps.length}),
    u?(u.steps.length+' 步 / '+CP.SEC.data.UAV.wps.length+' 航点'):'缺失']);
  var yms=document.getElementById('cp-log-yms-src');
  r.push(['YMS 原件已内嵌',!!yms&&yms.textContent.length>100000,
    yms?(yms.textContent.length+' 字符'):'缺失']);
  var vis='';
  [].forEach.call(document.body.querySelectorAll('*'),function(e){
    if(e.tagName==='SCRIPT'||e.tagName==='STYLE')return;
    [].forEach.call(e.childNodes,function(x){if(x.nodeType===3)vis+=x.nodeValue})});
  var hit=['\u6d4e\u5357\u4e1c\u660e','\u5927\u5b97\u80fd\u6e90']
    .filter(function(w){return vis.indexOf(w)>=0});
  r.push(['品牌合规：不出现其他案例名',hit.length===0,hit.join(',')||'ok']);
  console.table(r.map(function(x){return{检查项:x[0],通过:x[1]?'✔':'✘',详情:x[2]}}));
  return r;
};
